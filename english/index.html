<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>DualTalk AI — 우리집 영어회화</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --blue:#2563eb; --blue-soft:#dbeafe; --orange:#f97316; --orange-soft:#ffedd5;
  --green:#16a34a; --green-soft:#dcfce7; --red:#dc2626; --red-soft:#fee2e2;
  --violet:#7c3aed; --amber:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.4rem} h2{font-size:1.15rem} h3{font-size:1rem}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{font-size:1.3rem;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.topbar .title{flex:1;font-weight:700;font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--sub);font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;font-weight:700;font-size:1rem;transition:transform .05s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%;margin-top:8px}
.btn:disabled{opacity:.4}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.orange{background:var(--orange-soft);color:#c2410c}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.gray{background:#f1f5f9;color:var(--sub)}
/* home */
.profile-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.profile-card:active{transform:scale(.98)}
.avatar{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.avatar.dad{background:var(--blue-soft)} .avatar.gio{background:var(--orange-soft)}
.profile-card .info{flex:1}
.profile-card .name{font-weight:800;font-size:1.15rem}
.profile-card .desc{color:var(--sub);font-size:.85rem;margin-top:2px}
.stats-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:20px;color:#fff;padding:22px;margin-bottom:16px}
.hero p{opacity:.85;font-size:.9rem;margin-top:4px}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#eef2f7;padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* scenario list */
.scen-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.scen-item .emoji{font-size:1.5rem}
.scen-item .t{flex:1}
.scen-item .t .en{font-weight:700}
.scen-item .t .ko{color:var(--sub);font-size:.8rem}
.progress-dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.progress-dot.done{background:var(--green)}
.pct{font-size:.78rem;font-weight:800;color:var(--sub);min-width:36px;text-align:right}
.pct.good{color:var(--green)}
/* dialogue */
.dlg-line{display:flex;gap:8px;margin-bottom:10px}
.dlg-line.me{flex-direction:row-reverse}
.bubble{max-width:82%;padding:10px 13px;border-radius:14px;background:#eef2f7;font-size:.95rem;line-height:1.45}
.dlg-line.me .bubble{background:var(--blue-soft)}
.dlg-line.gio.me .bubble{background:var(--orange-soft)}
.bubble .ko{display:block;color:var(--sub);font-size:.78rem;margin-top:4px}
.bubble.now{outline:2px solid var(--blue)}
.speaker-tag{font-size:.7rem;color:var(--sub);align-self:flex-end;flex-shrink:0}
/* practice */
.practice-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.practice-box .target{font-size:1.25rem;font-weight:700;line-height:1.5;margin:10px 0}
.practice-box .target-ko{color:var(--sub);margin-bottom:8px}
.word-ok{color:var(--green)} .word-miss{color:var(--red);text-decoration:underline}
.mic-btn{width:76px;height:76px;border-radius:50%;background:var(--blue);color:#fff;font-size:2rem;
  display:inline-flex;align-items:center;justify-content:center;margin:12px auto;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.mic-btn.rec{background:var(--red);animation:pulse 1s infinite}
.mic-btn.orange{background:var(--orange);box-shadow:0 6px 18px rgba(249,115,22,.35)}
.mic-btn.orange.rec{background:var(--red)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.heard{background:#f1f5f9;border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--sub);min-height:38px;margin-top:8px}
.score-big{font-size:2.2rem;font-weight:900;margin:6px 0}
.score-big.good{color:var(--green)} .score-big.mid{color:var(--amber)} .score-big.bad{color:var(--red)}
.step-ind{display:flex;gap:4px;justify-content:center;margin-bottom:10px}
.step-ind i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.step-ind i.on{background:var(--blue)} .step-ind i.done{background:var(--green)}
.blurred{filter:blur(6px);transition:filter .2s;user-select:none}
.blurred.show{filter:none}
/* pattern chips */
.chip-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;min-height:44px}
.word-chip{padding:10px 16px;border-radius:12px;background:#fff;border:2px solid var(--orange);
  font-weight:700;font-size:1.05rem;color:#c2410c}
.word-chip:disabled{opacity:.25}
.built{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px;
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0}
.built .word-chip{border-color:var(--line);color:var(--ink);padding:8px 12px}
.built.ok{border-color:var(--green);background:var(--green-soft)}
.built.no{border-color:var(--red);background:var(--red-soft)}
/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:340px}
.chat-log{flex:1;overflow-y:auto;padding:4px 2px}
.chat-msg{display:flex;margin-bottom:10px}
.chat-msg.user{justify-content:flex-end}
.chat-msg .b{max-width:85%;padding:10px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);
  font-size:.95rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.chat-msg.user .b{background:var(--blue-soft);border-color:transparent}
.chat-msg .speak-again{font-size:.75rem;color:var(--sub);margin-top:4px}
.chat-input{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.chat-input textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;height:46px;background:#fff}
.chat-mic{width:46px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;flex-shrink:0}
.chat-mic.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1s infinite}
.chat-send{width:46px;height:46px;border-radius:12px;background:var(--blue);color:#fff;font-size:1.1rem;flex-shrink:0}
.typing{color:var(--sub);font-size:.85rem;padding:4px}
/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row label{font-weight:600;font-size:.95rem}
.set-row select,.set-row input[type=text],.set-row input[type=password]{
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:56%;background:#fff}
.key-expr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.key-expr:last-child{border-bottom:none}
.key-expr .ko{color:var(--sub);font-size:.8rem}
.key-expr .play{font-size:1rem;padding:4px 8px;border-radius:8px;background:#f1f5f9;flex-shrink:0}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 13px;font-size:.85rem;margin-bottom:12px}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   우리집 영어회화 — 아빠(비즈니스 미팅) & 지오(일상회화)
   단일 파일 PWA · localStorage · Web Speech API(TTS/STT)
   ============================================================ */

/* ---------- 콘텐츠 ---------- */
const CONTENT = {
  dad: {
    label: "아빠", emoji: "👔", color: "blue",
    desc: "외국계 기업 영어 미팅 정복",
    scenarios: [
      { id:"smalltalk", emoji:"☕", title:"Small Talk Before a Meeting", ko:"미팅 전 스몰토크",
        keys:[
          {en:"How was your weekend?", ko:"주말 어떻게 보내셨어요?"},
          {en:"How's the project going?", ko:"프로젝트는 어떻게 되어가요?"},
          {en:"Shall we get started?", ko:"시작할까요?"}],
        lines:[
          {s:"A", en:"Hi, good to see you! How was your weekend?", ko:"안녕하세요, 반가워요! 주말 잘 보내셨어요?"},
          {s:"B", en:"Good to see you too! It was great. I went hiking with my family.", ko:"저도 반가워요! 아주 좋았어요. 가족들과 등산 다녀왔어요."},
          {s:"A", en:"That sounds fun. How's the project going on your side?", ko:"재밌었겠네요. 그쪽 프로젝트는 어떻게 되어가요?"},
          {s:"B", en:"Pretty well. We're almost done with the first phase.", ko:"꽤 잘 되고 있어요. 1단계는 거의 끝났습니다."},
          {s:"A", en:"Glad to hear that. Oh, I think everyone has joined now.", ko:"다행이네요. 아, 이제 다들 들어온 것 같아요."},
          {s:"B", en:"Okay, shall we get started?", ko:"네, 시작할까요?"}]},
      { id:"kickoff", emoji:"🎬", title:"Kicking Off a Meeting", ko:"회의 시작하기",
        keys:[
          {en:"Thanks for joining today.", ko:"오늘 참석해 주셔서 감사합니다."},
          {en:"I'd like to talk about three things.", ko:"세 가지에 대해 이야기하고 싶습니다."},
          {en:"Let me share my screen.", ko:"화면 공유하겠습니다."}],
        lines:[
          {s:"B", en:"Good morning, everyone. Thanks for joining today.", ko:"좋은 아침입니다. 오늘 참석해 주셔서 감사합니다."},
          {s:"A", en:"Good morning!", ko:"좋은 아침이에요!"},
          {s:"B", en:"Today, I'd like to talk about three things: the schedule, the budget, and next steps.", ko:"오늘은 세 가지, 일정과 예산 그리고 다음 단계에 대해 이야기하려 합니다."},
          {s:"A", en:"Sounds good.", ko:"좋습니다."},
          {s:"B", en:"First, let's look at the schedule. Please stop me if you have any questions.", ko:"먼저 일정부터 볼게요. 질문 있으면 언제든 말씀해 주세요."},
          {s:"A", en:"Sure, go ahead.", ko:"네, 진행하세요."},
          {s:"B", en:"Great. Let me share my screen.", ko:"좋아요. 화면 공유하겠습니다."}]},
      { id:"status", emoji:"📊", title:"Giving a Status Update", ko:"진행 상황 보고",
        keys:[
          {en:"We are on track.", ko:"계획대로 진행 중입니다."},
          {en:"Development is seventy percent complete.", ko:"개발은 70% 완료됐습니다."},
          {en:"I'll share the details by email.", ko:"자세한 내용은 이메일로 공유하겠습니다."}],
        lines:[
          {s:"A", en:"Can you give us a quick update on your project?", ko:"프로젝트 진행 상황을 간단히 공유해 주시겠어요?"},
          {s:"B", en:"Sure. Overall, we are on track.", ko:"네. 전반적으로 계획대로 진행 중입니다."},
          {s:"A", en:"How about the design work?", ko:"디자인 작업은 어떤가요?"},
          {s:"B", en:"The design is done, and development is about seventy percent complete.", ko:"디자인은 끝났고, 개발은 약 70% 완료됐습니다."},
          {s:"A", en:"Any issues we should know about?", ko:"저희가 알아야 할 이슈가 있나요?"},
          {s:"B", en:"One small issue. The testing may take one more week than planned.", ko:"작은 이슈가 하나 있어요. 테스트가 계획보다 일주일 더 걸릴 수 있습니다."},
          {s:"A", en:"Okay, thanks for the heads-up.", ko:"알겠습니다, 미리 알려줘서 고마워요."},
          {s:"B", en:"I'll share the details by email after this meeting.", ko:"회의 끝나고 자세한 내용은 이메일로 공유하겠습니다."}]},
      { id:"opinion", emoji:"💬", title:"Sharing Your Opinion", ko:"의견 말하기",
        keys:[
          {en:"In my opinion, the timeline is too tight.", ko:"제 생각에는 일정이 너무 빠듯합니다."},
          {en:"That's a fair point.", ko:"맞는 말씀입니다."},
          {en:"I'd suggest moving the date.", ko:"날짜를 옮기는 걸 제안합니다."}],
        lines:[
          {s:"A", en:"What do you think about the new plan?", ko:"새 계획에 대해 어떻게 생각하세요?"},
          {s:"B", en:"In my opinion, it's a good direction, but the timeline is too tight.", ko:"제 생각에 방향은 좋지만, 일정이 너무 빠듯합니다."},
          {s:"A", en:"Why do you think so?", ko:"왜 그렇게 생각하세요?"},
          {s:"B", en:"Because we only have two weeks, and we still need time for testing.", ko:"2주밖에 없는데, 테스트할 시간도 필요하니까요."},
          {s:"A", en:"That's a fair point. What would you suggest?", ko:"맞는 말이네요. 어떻게 하는 게 좋을까요?"},
          {s:"B", en:"I'd suggest moving the release date by one week.", ko:"출시일을 일주일 미루는 것을 제안합니다."},
          {s:"A", en:"Okay, let's discuss that with the team.", ko:"좋아요, 팀과 논의해 봅시다."}]},
      { id:"disagree", emoji:"🤝", title:"Disagreeing Politely", ko:"정중하게 반대하기",
        keys:[
          {en:"I see your point, but I have a different opinion.", ko:"무슨 말씀인지 알지만, 저는 생각이 다릅니다."},
          {en:"I'm afraid next month is too early.", ko:"죄송하지만 다음 달은 너무 이릅니다."},
          {en:"Let me check and get back to you.", ko:"확인하고 다시 말씀드리겠습니다."}],
        lines:[
          {s:"A", en:"I think we should launch the product next month.", ko:"다음 달에 제품을 출시해야 한다고 생각해요."},
          {s:"B", en:"I see your point, but I have a different opinion.", ko:"무슨 말씀인지 알겠지만, 저는 생각이 좀 다릅니다."},
          {s:"A", en:"Please, go ahead.", ko:"네, 말씀해 보세요."},
          {s:"B", en:"I'm afraid next month is too early. The quality is not ready yet.", ko:"죄송하지만 다음 달은 너무 이릅니다. 품질이 아직 준비되지 않았어요."},
          {s:"A", en:"Hmm, what if we reduce the scope?", ko:"흠, 범위를 줄이면 어떨까요?"},
          {s:"B", en:"That could work. Let me check with my team and get back to you.", ko:"그건 가능할 것 같아요. 팀과 확인하고 다시 말씀드릴게요."},
          {s:"A", en:"Sounds good. Thanks for being honest.", ko:"좋습니다. 솔직하게 말해줘서 고마워요."}]},
      { id:"clarify", emoji:"🔍", title:"Asking for Clarification", ko:"다시 묻고 확인하기",
        keys:[
          {en:"Could you say that again more slowly?", ko:"조금 천천히 다시 말씀해 주시겠어요?"},
          {en:"So you mean we have three weeks, right?", ko:"그러니까 3주 남았다는 말씀이죠?"},
          {en:"Just to make sure, who is in charge?", ko:"확실히 하자면, 담당자가 누구인가요?"}],
        lines:[
          {s:"A", en:"We need to finalize the budget by the end of this quarter.", ko:"이번 분기 말까지 예산을 확정해야 합니다."},
          {s:"B", en:"Sorry, could you say that again more slowly?", ko:"죄송한데, 조금 천천히 다시 말씀해 주시겠어요?"},
          {s:"A", en:"Sure. We need to finalize the budget by the end of March.", ko:"네. 3월 말까지 예산을 확정해야 해요."},
          {s:"B", en:"I see. So you mean we have about three weeks left, right?", ko:"알겠습니다. 그러니까 3주 정도 남았다는 말씀이죠?"},
          {s:"A", en:"Exactly.", ko:"정확해요."},
          {s:"B", en:"Just to make sure, who is in charge of the final approval?", ko:"확실히 해두자면, 최종 승인 담당은 누구인가요?"},
          {s:"A", en:"That would be the finance team.", ko:"재무팀입니다."},
          {s:"B", en:"Got it. Thank you for the clarification.", ko:"알겠습니다. 설명 감사합니다."}]},
      { id:"schedule", emoji:"📅", title:"Scheduling a Meeting", ko:"일정 조율하기",
        keys:[
          {en:"When works best for you?", ko:"언제가 가장 좋으세요?"},
          {en:"Could we do Thursday afternoon instead?", ko:"대신 목요일 오후는 어떨까요?"},
          {en:"I'll send you a calendar invite.", ko:"캘린더 초대 보내드릴게요."}],
        lines:[
          {s:"A", en:"Can we set up a meeting to discuss the next steps?", ko:"다음 단계를 논의할 미팅을 잡을 수 있을까요?"},
          {s:"B", en:"Sure. When works best for you?", ko:"물론이죠. 언제가 가장 좋으세요?"},
          {s:"A", en:"How about Thursday morning at ten?", ko:"목요일 오전 10시는 어때요?"},
          {s:"B", en:"I'm afraid I have another meeting at that time. Could we do Thursday afternoon instead?", ko:"그 시간엔 다른 미팅이 있어서요. 대신 목요일 오후는 어떨까요?"},
          {s:"A", en:"Let me check. Yes, two o'clock works for me.", ko:"확인해 볼게요. 네, 2시 괜찮아요."},
          {s:"B", en:"Perfect. I'll send you a calendar invite.", ko:"좋습니다. 캘린더 초대 보내드릴게요."},
          {s:"A", en:"Great, talk to you then.", ko:"좋아요, 그때 봬요."}]},
      { id:"wrapup", emoji:"🏁", title:"Wrapping Up a Meeting", ko:"회의 마무리하기",
        keys:[

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function markPracticed(profile){
  const p = store.profiles[profile];
  const t = todayStr();
  if(!p.days.includes(t)){ p.days.push(t); if(p.days.length>400) p.days = p.days.slice(-400); }
  save();
}
function streakOf(profile){
  const days = new Set(store.profiles[profile].days);
  let streak = 0;
  const d = new Date();
  // 오늘 안 했으면 어제부터 센다
  if(!days.has(todayStr())) d.setDate(d.getDate()-1);
  for(;;){
    const s = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(days.has(s)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

/* ---------- 음성 (TTS / STT) ---------- */
const synth = window.speechSynthesis;
let enVoices = [];
function loadVoices(){
  if(!synth) return;
  enVoices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function pickVoice(){
  if(!enVoices.length) return null;
  if(store.settings.voiceURI){
    const v = enVoices.find(v=>v.voiceURI===store.settings.voiceURI);
    if(v) return v;
  }
  return enVoices.find(v=>v.lang==="en-US") || enVoices[0];
}
let speakingToken = 0;
function speak(text, opts){
  opts = opts || {};
  if(!synth){ if(opts.onend) opts.onend(); return; }
  synth.cancel();
  const token = ++speakingToken;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = opts.rate != null ? opts.rate : store.settings.rate;
  const v = pickVoice(); if(v) u.voice = v;
  u.onend = ()=>{ if(token===speakingToken && opts.onend) opts.onend(); };
  u.onerror = ()=>{ if(token===speakingToken && opts.onend) opts.onend(); };
  synth.speak(u);
}
function stopSpeak(){ speakingToken++; if(synth) synth.cancel(); }

const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, recActive = false;
function sttStart(handlers){
  if(!SRClass){ if(handlers.onError) handlers.onError("unsupported"); return false; }
  stopSpeak();
  try{
    rec = new SRClass();
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    let finalText = "";
    rec.onresult = (ev)=>{
      let interim = "";
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r = ev.results[i];
        if(r.isFinal) finalText += r[0].transcript + " ";
        else interim += r[0].transcript;
      }
      if(handlers.onInterim) handlers.onInterim((finalText+interim).trim());
    };
    rec.onerror = (ev)=>{ recActive=false; if(handlers.onError) handlers.onError(ev.error||"error"); };
    rec.onend = ()=>{ recActive=false; if(handlers.onEnd) handlers.onEnd(finalText.trim()); };
    rec.start();
    recActive = true;
    return true;
  }catch(e){ recActive=false; if(handlers.onError) handlers.onError("start-failed"); return false; }
}
function sttStop(){ if(rec && recActive){ try{ rec.stop(); }catch(e){} } }

/* ---------- 채점 ---------- */
function normWords(s){
  return s.toLowerCase()
    .replace(/[’]/g,"'")
    .replace(/[^a-z0-9' ]+/g," ")
    .split(/\s+/).filter(Boolean);
}
function scoreSpeech(target, spoken){
  const t = normWords(target), s = normWords(spoken);
  const marks = t.map(()=>false);
  let j = 0, hits = 0;
  for(let i=0;i<t.length;i++){
    const k = s.indexOf(t[i], j);
    if(k >= 0){ marks[i]=true; hits++; j = k+1; }
  }
  return { pct: t.length ? Math.round(hits/t.length*100) : 0, marks };
}
function markedTarget(target, marks){
  // 원문 표기 단어 위에 채점 색을 입힌다 (하이픈 단어는 채점 토큰 여러 개를 소비)
  const words = target.split(/\s+/);
  let mi = 0;
  return words.map(w=>{
    const toks = normWords(w);
    if(!toks.length) return esc(w);
    let ok = true;
    toks.forEach(()=>{ if(!marks[mi]) ok = false; mi++; });
    return '<span class="'+(ok?"word-ok":"word-miss")+'">'+esc(w)+"</span>";
  }).join(" ");
}
function scoreClass(pct){ return pct>=80 ? "good" : pct>=50 ? "mid" : "bad"; }
function scoreMsg(pct){
  if(pct>=90) return "완벽해요! 👏";
  if(pct>=80) return "아주 좋아요! 🎉";
  if(pct>=60) return "좋아요! 조금만 더!";
  if(pct>=30) return "다시 한번 해볼까요?";
  return "괜찮아요, 천천히 다시!";
}

/* ---------- 유틸 ---------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function $(id){ return document.getElementById(id); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function getScenario(profile, id){
  return CONTENT[profile].scenarios.find(s=>s.id===id);
}
function scenProg(profile, id){
  const p = store.profiles[profile].scen[id];
  return p || { listen:0, repeat:0, role:0 };
}
function setScenProg(profile, id, field, val){
  const p = store.profiles[profile];
  if(!p.scen[id]) p.scen[id] = { listen:0, repeat:0, role:0 };
  p.scen[id][field] = Math.max(p.scen[id][field]||0, val);
  save();
}

/* 역할극 모드: 상대 대사는 앱이, 내 대사는 내가 */
function vRole(s){
  const sess = ui.session;
  const myLines = s.lines.filter(l=>l.s==="B").length;
  if(sess.finished){
    const avg = sess.scores.length? Math.round(sess.scores.reduce((a,b)=>a+b,0)/sess.scores.length) : 0;
    return `
    <div class="practice-box">
      <div style="font-size:3rem">${avg>=80?"🏆":avg>=60?"🎉":"💪"}</div>
      <div class="score-big ${scoreClass(avg)}">${avg}%</div>
      <div>역할극 완료! 내 대사 ${myLines}개 ${scoreMsg(avg)}</div>
      ${ui.profile==="gio"? `<div style="font-size:1.05rem;margin-top:8px">${avg>=60? "🏅 <b>"+s.emoji+"</b> 스티커 획득!" : "60점을 넘으면 "+s.emoji+" 스티커를 받아요!"}</div>`:""}
      <button class="btn ${ui.profile==='gio'?'orange':'primary'} block" onclick="App.setMode('role')">🔁 한 번 더</button>
      <button class="btn ghost block" onclick="App.back()">목록으로</button>

  return `

    ${sess.idx===0? `<div class="muted">내 대사(파란 말풍선) 차례가 되면 직접 말해보세요!</div>` : dlgHTML(s, sess.idx-1, -1)}
  </div>
  <div class="practice-box">
    <div class="step-ind">${s.lines.map((_,i)=>`<i class="${i<sess.idx?'done':i===sess.idx?'on':''}"></i>`).join("")}</div>
    ${myTurn? `
      <div class="muted">🎭 내 차례! 이 말을 영어로 해보세요</div>
      <div class="target-ko" style="font-size:1.1rem;font-weight:700;color:var(--ink)">"${esc(line.ko)}"</div>
      <div class="target ${res?'':'blurred'+(sess.hint?' show':'')}" onclick="App.toggleHint()">
        ${res? markedTarget(line.en, res.marks) : esc(line.en)}</div>
      ${res? "" : `<div class="muted">${sess.hint? "" : "막히면 문장을 눌러 힌트 보기"}</div>`}
      ${sttUI()}
      ${res? `
        <div class="score-big ${scoreClass(res.pct)}">${res.pct}%</div>
        <div>${scoreMsg(res.pct)}</div>

      `:""}

function sttUI(){
  const sess = ui.session;
  if(!SRClass) return `<div class="notice">이 브라우저는 음성인식을 지원하지 않아요. 크롬에서 열어주세요.</div>`;
  return `

    <div class="heard">${sess.heard? esc(sess.heard):"..."}</div>
  </div>`;
}

/* ----- 패턴 연습 (지오) ----- */
function getPattern(id){ return CONTENT.gio.patterns.find(p=>p.id===id); }
function newPatSession(p){
  return { exIdx:0, chips:[], picked:[], checked:null, scores:[], finished:false,
           heard:"", listening:false, result:null, phase:"build" }; // build | speak
}
function setupPatChips(sess, p){
  const words = p.examples[sess.exIdx].en.replace(/[.,!?]/g,"").split(/\s+/);
  sess.chips = shuffle(words.map((w,i)=>({w, i, used:false})));
  // 셔플 결과가 정답 순서면 한 번 더 섞는다
  if(words.length>2 && sess.chips.every((c,i)=>c.i===i)) sess.chips = shuffle(sess.chips);
  sess.picked = [];
  sess.checked = null;
  sess.result = null; sess.heard = "";
  sess.phase = "build";
}
function vPattern(){
  const p = getPattern(ui.patternId);
  const sess = ui.session;
  if(sess.finished){
    const pct = Math.round(sess.scores.reduce((a,b)=>a+b,0)/sess.scores.length);
    return topbar(p.emoji+" "+esc(p.title)) + `
    <div class="practice-box">
      <div style="font-size:3rem">${pct>=80?"🏆":"🎉"}</div>
      <div class="score-big ${scoreClass(pct)}">${pct}%</div>
      <div>"${esc(p.title)}" 패턴 ${p.examples.length}문장 완료!</div>
      <button class="btn orange block" onclick="App.openPattern('${p.id}')">🔁 한 번 더</button>
      <button class="btn ghost block" onclick="App.back()">목록으로</button>
    </div>`;
  }
  const ex = p.examples[sess.exIdx];
  const total = p.examples.length;
  let body = "";
  if(sess.phase==="build"){
    const target = ex.en.replace(/[.,!?]/g,"").split(/\s+/);
    body = `
    <div class="muted">단어를 순서대로 눌러 문장을 만들어 보세요</div>
    <div class="target-ko" style="font-size:1.1rem;font-weight:700;color:var(--ink);margin-top:6px">"${esc(ex.ko)}"</div>
    <div class="built ${sess.checked===true?'ok':sess.checked===false?'no':''}">
      ${sess.picked.length? sess.picked.map((c,i)=>`<button class="word-chip" onclick="App.unpick(${i})">${esc(c.w)}</button>`).join("") : '<span class="muted">여기에 문장이 만들어져요</span>'}
    </div>
    <div class="chip-pool">
      ${sess.chips.map((c,i)=>`<button class="word-chip" ${c.used?'disabled':''} onclick="App.pick(${i})">${esc(c.w)}</button>`).join("")}
    </div>
    ${sess.checked===true? `
      <div class="score-big good" style="font-size:1.4rem">정답! 🎉 ${esc(ex.en)}</div>
      <button class="btn ghost small" onclick="App.sayEx()">🔊 듣기</button>
      ${SRClass? `<button class="btn orange block" onclick="App.patToSpeak()">🎤 이제 말해보기</button>`
               : `<button class="btn orange block" onclick="App.patNext(100)">다음 →</button>`}
    ` : sess.checked===false? `
      <div style="color:var(--red);font-weight:700">앗, 순서가 달라요. 다시 해볼까요?</div>
      <button class="btn ghost small" onclick="App.patRetry()">🔄 다시 만들기</button>
      <button class="btn ghost small" onclick="App.sayEx()">🔊 정답 듣기</button>
    ` : (sess.picked.length===target.length? `
      <button class="btn orange block" onclick="App.patCheck()">확인하기 ✓</button>`:"")}
    `;
  } else {
    body = `
    <div class="muted">이제 이 문장을 직접 말해보세요!</div>
    <div class="target" style="margin-top:8px">${sess.result? markedTarget(ex.en, sess.result.marks) : esc(ex.en)}</div>
    <div class="target-ko">${esc(ex.ko)}</div>
    <button class="btn ghost small" onclick="App.sayEx()">🔊 다시 듣기</button>
    ${sttUI()}
    ${sess.result? `
      <div class="score-big ${scoreClass(sess.result.pct)}">${sess.result.pct}%</div>
      <div>${scoreMsg(sess.result.pct)}</div>
      <button class="btn orange block" onclick="App.patNext(${sess.result.pct})">${sess.exIdx+1<total? "다음 문장 →":"결과 보기 🏁"}</button>
    `:""}`;
  }
  return topbar(p.emoji+" "+esc(p.title)) + `
  <div class="practice-box">
    <div class="step-ind">${p.examples.map((_,i)=>`<i class="${i<sess.exIdx?'done':i===sess.exIdx?'on':''}"></i>`).join("")}</div>
    <div class="muted">${sess.exIdx+1} / ${total}</div>
    ${body}
  </div>`;
}

function personaById(id){ return PERSONAS.find(p=>p.id===id); }
function chatMetaOf(pid){ return store.profiles[pid].chatMeta || (store.profiles[pid].chatMeta = {mode:"free"}); }
function buddySystem(p, gender){
  const name = gender==="f" ? p.f : p.m;
  return `You are ${name}, the user's close ${gender==="f"?"female":"male"} friend and casual English chat buddy. Your personality (MBTI ${p.mbti}): ${p.style}.
- This is relaxed after-work chit-chat with a Korean friend who is improving spoken English. Keep replies short (1-3 sentences), like messages between close friends.
- Use natural spoken English: contractions, casual slang and idioms that fit your personality.
- NEVER lecture about grammar or point out mistakes. Instead use recasting: if the user says something awkward, naturally weave the corrected phrasing into your own reply.
- Stay fully in character as ${name}. React first, then keep the conversation alive with a question or a playful comment.
- English only.`;
}
function bizSystem(r){
  return `You are role-playing as ${r.role} in an English business conversation practice for a Korean professional at a global company.
Situation: ${r.situation}.
- Stay in character. Keep the conversation realistic and professional, and keep each reply to 2-3 sentences, then hand the turn back with a question or a prompt.
- Do not correct grammar mid-conversation; use natural recasting instead (restate their idea with the natural professional phrasing inside your reply).
- After roughly 5 of the user's turns, wrap up the scenario naturally and thank them.
- English only.`;
}
function buildSystem(pid){
  if(pid==="gio") return AI_PROMPTS.gio;
  const meta = chatMetaOf("dad");
  if(meta.mode==="buddy" && meta.personaId) return buddySystem(personaById(meta.personaId), meta.gender);
  if(meta.mode==="biz" && meta.rpId) return bizSystem(BIZ_ROLEPLAYS.find(x=>x.id===meta.rpId));
  return AI_PROMPTS.dad;
}

/* claude.ai에 붙여넣어 쓰는 프롬프트 (API 키 없이 구독으로 대화할 때) */
const CLIP_HEADER = "[영어 회화 연습 롤플레잉입니다. 이 대화가 끝날 때까지 아래 역할과 규칙을 유지해 주세요.]\n\n";
const CLIP_EXTRA = `\n\nExtra commands (follow these throughout the conversation):
- If I say "hint", pause and suggest 3 replies I could say next (easy, medium, challenging), then continue the roleplay.
- If I say "report", write a short feedback report in KOREAN with three sections — 📌 문법 교정 / ✨ 더 자연스러운 표현 / 👍 잘한 점 — then continue.`;
function claudePrompt(kind, id, gender){
  if(kind==="coco")
    return CLIP_HEADER + AI_PROMPTS.gio + CLIP_EXTRA + `\n\nStart now by greeting me: "Woof woof! Hi! I'm Coco! 🐶 What's your name?"`;
  if(kind==="coach")
    return CLIP_HEADER + AI_PROMPTS.dad + CLIP_EXTRA + `\n\nStart now by greeting me in English and asking about my day.`;
  if(kind==="buddy"){
    const p = personaById(id);
    return CLIP_HEADER + buddySystem(p, gender) + CLIP_EXTRA + `\n\nStart now with: "${p.opener}"`;
  }
  const r = BIZ_ROLEPLAYS.find(x=>x.id===id);
  return CLIP_HEADER + bizSystem(r) + CLIP_EXTRA + `\n\nStart now with: "${r.opener}"`;
}
function fallbackCopy(t){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(()=>true).catch(()=>fallbackCopy(t));
  }
  return Promise.resolve(fallbackCopy(t));
}
function transcriptOf(pid){
  return store.profiles[pid].chat.filter(m=>!m.sys)
    .map(m=> (m.role==="user"? "Learner: " : "Partner: ") + m.content).join("\n");
}
async function callAPI(system, messages){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": store.settings.apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({
      model: store.settings.model,
      max_tokens: 1024,
      system: system,
      messages: messages
    })
  });
  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j.error && j.error.message) || ""; }catch(e){}
    if(res.status===401) throw new Error("API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.");
    if(res.status===429) throw new Error("요청이 너무 많아요. 잠시 후 다시 시도해 주세요.");
    throw new Error("API 오류 ("+res.status+") "+detail);
  }
  const data = await res.json();
  if(data.stop_reason==="refusal") return "Sorry, I can't talk about that. Let's talk about something else! 😊";
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}
async function chatReply(pid){
  // 리포트 등 sys 메시지는 문맥에서 제외하고, 연속 같은 역할 메시지는 합친다
  const recent = store.profiles[pid].chat.filter(m=>!m.sys).slice(-20);
  const msgs = [];
  recent.forEach(m=>{
    const last = msgs[msgs.length-1];
    if(last && last.role===m.role) last.content += "\n" + m.content;
    else msgs.push({role:m.role, content:m.content});
  });
  // 페르소나/롤플레잉 오프닝(assistant)으로 시작하는 경우 API 규칙에 맞게 user 턴을 앞에 채운다
  if(msgs.length && msgs[0].role==="assistant") msgs.unshift({role:"user", content:"(Let's start the conversation.)"});
  return callAPI(buildSystem(pid), msgs);
}

    const playNext = ()=>{
      if(!sess.playing || ui.view!=="scenario" || ui.session!==sess) return;
      if(sess.idx >= s.lines.length){
        sess.playing = false;
        setScenProg(ui.profile, s.id, "listen", 1);
        markPracticed(ui.profile);
        render();
        return;
      }
      render();

      }});
    };
    playNext();
  },
  stopListen(){ ui.session.playing = false; stopSpeak(); render(); },
  sayLine(i){
    const s = getScenario(ui.profile, ui.scenarioId);

  },

  toggleMic(){
    const sess = ui.session;
    if(sess.listening){ sttStop(); return; }
    const target = App._currentTarget();
    if(!target) return;
    sess.heard = ""; sess.result = null; sess.listening = true;
    render();
    const ok = sttStart({
      onInterim(t){ sess.heard = t; const el = document.querySelector(".heard"); if(el) el.textContent = t||"..."; },
      onEnd(finalText){
        sess.listening = false;
        if(ui.view!=="scenario" && ui.view!=="pattern"){ return; }
        if(finalText){
          sess.heard = finalText;
          sess.result = scoreSpeech(target, finalText);
          store.profiles[ui.profile].spoken = (store.profiles[ui.profile].spoken||0)+1;
          markPracticed(ui.profile);
          if(sess.result.pct>=50) speakFeedbackTone(true);
        }
        render();
      },
      onError(err){
        sess.listening = false;
        if(err==="not-allowed" || err==="service-not-allowed"){
          alert("마이크 권한이 필요해요. 브라우저 설정에서 마이크를 허용해 주세요.");
        } else if(err!=="no-speech" && err!=="aborted"){
          console.warn("STT error:", err);
        }
        render();
      }
    });
    if(!ok){ sess.listening=false; render(); }
  },
  _currentTarget(){
    if(ui.view==="scenario"){
      const s = getScenario(ui.profile, ui.scenarioId);
      return s.lines[ui.session.idx].en;
    }
    if(ui.view==="pattern"){
      const p = getPattern(ui.patternId);
      return p.examples[ui.session.exIdx].en;
    }

      speak(s.lines[sess.idx].en);

    sess.result = null; sess.heard = ""; sess.hint = false;
    if(sess.idx+1 < s.lines.length){
      sess.idx++;
      render();
      // 다음이 상대 대사면 자동 재생
      if(s.lines[sess.idx].s!=="B"){
        setTimeout(()=>{ if(ui.session===sess && ui.view==="scenario") App.playPartnerLine(); }, 350);
      }
    } else {
      sess.finished = true;
      const avg = sess.scores.length? Math.round(sess.scores.reduce((a,b)=>a+b,0)/sess.scores.length):0;
      setScenProg(ui.profile, s.id, "role", avg);

  pick(i){
    const sess = ui.session;
    if(sess.checked===true) return;
    sess.checked = null;
    const c = sess.chips[i];
    if(c.used) return;
    c.used = true;
    sess.picked.push(c);
    render();
  },
  unpick(i){
    const sess = ui.session;
    if(sess.checked===true) return;
    sess.checked = null;
    const c = sess.picked.splice(i,1)[0];
    c.used = false;
    render();

    const p = getPattern(ui.patternId);
    const sess = ui.session;
    const target = p.examples[sess.exIdx].en.replace(/[.,!?]/g,"").split(/\s+/);
    const built = sess.picked.map(c=>c.w);
    sess.checked = target.length===built.length && target.every((w,i)=>w.toLowerCase()===built[i].toLowerCase());
    if(sess.checked){
      speak(p.examples[sess.exIdx].en);
      markPracticed("gio");

    render();

    save(); render(); scrollChat();
  },

  /* 설정 */
  setRate(v){ store.settings.rate = parseFloat(v); save(); },
  setVoice(v){ store.settings.voiceURI = v; save(); },
  setApiKey(v){ store.settings.apiKey = v.trim(); save(); },
  setModel(v){ store.settings.model = v; save(); },
  toggleAutoSpeak(){ store.settings.autoSpeak = !store.settings.autoSpeak; save(); render(); },
  exportData(){
    const blob = new Blob([JSON.stringify(store, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "english-backup-"+todayStr()+".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  },
  importData(){
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json";
    input.onchange = ()=>{
      const f = input.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed.profiles) throw new Error("형식이 다른 파일이에요.");
          store = Object.assign(defaultStore(), parsed);
          save();
          alert("가져오기 완료!");
          render();
        }catch(e){ alert("가져오기에 실패했어요: "+e.message); }
      };
      reader.readAsText(f);
    };
    input.click();
  },
  resetData(){
    if(!confirm("모든 학습 기록과 설정이 지워져요. 정말 초기화할까요?")) return;
    store = defaultStore();
    save(); go("home");
  }
};
window.App = App;

function speakFeedbackTone(good){ /* 자리표시자: 지금은 소리 없이 시각 피드백만 사용 */ }

render();
</script>
