/* ---------- 액션 (전역) ---------- */
const App = {
  /* 이동 */
  openProfile(pid){ ui.profile = pid; ui.tab = "scen"; go("list"); },
  setTab(t){
    stopSpeak(); sttStop(); ui.tab = t; ui.hints = null;
    // 지오 AI 탭: 코코가 먼저 인사
    if(t==="chat" && ui.profile==="gio" && store.settings.apiKey && !store.profiles.gio.chat.length){
      store.profiles.gio.chat.push({role:"assistant", content:"Woof woof! Hi! I'm Coco! 🐶 What's your name?"});
      save();
    }
    render(); if(t==="chat") scrollChat();
  },
  back(to){
    stopSpeak(); sttStop();
    if(to){ ui.view = to; render(); return; }
    if(ui.view==="quiz"){ App.backToLesson(); return; }
    if(ui.view==="reader"){
      if(lessonsOf(getBook(ui.bookId)).length > 1) go("lessons");
      else { ui.tab = "read"; go("list"); }
    }
    else if(ui.view==="lessons"){ ui.tab = "read"; go("list"); }
    else if(ui.view==="scenario" || ui.view==="pattern"){ if(ui.view==="pattern") ui.tab="pat"; go("list"); }
    else if(ui.view==="list") go("home");
    else go("home");
  },
  openSettings(from){ ui.fromView = from || ui.view; loadVoices(); go("settings"); },
  openScenario(id){
    ui.scenarioId = id;
    ui.session = newScenSession("listen");
    go("scenario");
  },
  setMode(m){
    stopSpeak(); sttStop();
    ui.session = newScenSession(m);
    render();
    // 따라하기 모드는 첫 문장을 바로 들려준다
    if(m==="repeat"){
      const s = getScenario(ui.profile, ui.scenarioId);
      if(s) speak(s.lines[0].en);
    }
  },

  /* 듣기 */
  playAll(){
    const s = getScenario(ui.profile, ui.scenarioId);
    const sess = ui.session;
    sess.playing = true; sess.idx = 0;
    const playNext = ()=>{
      if(!sess.playing || ui.view!=="scenario" || ui.session!==sess) return;
      if(sess.idx >= s.lines.length){
        sess.playing = false;
        setScenProg(ui.profile, s.id, "listen", 1);
        markPracticed(ui.profile);
        render();
        return;
      }
      render();
      speak(s.lines[sess.idx].en, { onend: ()=>{
        sess.idx++;
        setTimeout(playNext, 350);
      }});
    };
    playNext();
  },
  stopListen(){ ui.session.playing = false; stopSpeak(); render(); },
  sayLine(i){
    const s = getScenario(ui.profile, ui.scenarioId);
    if(s && s.lines[i]) speak(s.lines[i].en);
  },
  sayKey(i){
    const s = getScenario(ui.profile, ui.scenarioId);
    if(s && s.keys[i]) speak(s.keys[i].en);
  },
  sayText(t){ speak(t); },
  sayEx(){
    const p = getPattern(ui.patternId);
    if(p) speak(p.examples[ui.session.exIdx].en);
  },

  /* 마이크 (따라하기/역할극/패턴 말하기 공용) */
  toggleMic(){
    const sess = ui.session;
    if(sess.listening){ sttStop(); return; }
    const target = App._currentTarget();
    if(!target) return;
    sess.heard = ""; sess.result = null; sess.listening = true;
    render();
    const ok = sttStart({
      onInterim(t){ sess.heard = t; const el = document.querySelector(".heard"); if(el) el.textContent = t||"..."; },
      onEnd(finalText){
        sess.listening = false;
        if(ui.view!=="scenario" && ui.view!=="pattern" && ui.view!=="reader"){ return; }
        if(finalText){
          sess.heard = finalText;
          sess.result = scoreSpeech(target, finalText);
          store.profiles[ui.profile].spoken = (store.profiles[ui.profile].spoken||0)+1;
          markPracticed(ui.profile);
          if(sess.result.pct>=50) speakFeedbackTone(true);
        }
        render();
      },
      onError(err){
        sess.listening = false;
        if(err==="not-allowed" || err==="service-not-allowed"){
          alert("마이크 권한이 필요해요. 브라우저 설정에서 마이크를 허용해 주세요.");
        } else if(err!=="no-speech" && err!=="aborted"){
          console.warn("STT error:", err);
        }
        render();
      }
    });
    if(!ok){ sess.listening=false; render(); }
  },
  _currentTarget(){
    if(ui.view==="scenario"){
      const s = getScenario(ui.profile, ui.scenarioId);
      return s.lines[ui.session.idx].en;
    }
    if(ui.view==="pattern"){
      const p = getPattern(ui.patternId);
      return p.examples[ui.session.exIdx].en;
    }
    if(ui.view==="reader"){
      return curSents()[ui.session.sel] || null;
    }
    return null;
  },

  /* 따라하기 진행 */
  nextRepeat(){
    const s = getScenario(ui.profile, ui.scenarioId);
    const sess = ui.session;
    sess.scores.push(sess.result? sess.result.pct : 0);
    sess.result = null; sess.heard = "";
    if(sess.idx+1 < s.lines.length){
      sess.idx++;
      render();
      speak(s.lines[sess.idx].en);
    } else {
      sess.finished = true;
      const avg = Math.round(sess.scores.reduce((a,b)=>a+b,0)/sess.scores.length);
      setScenProg(ui.profile, s.id, "repeat", avg);
      markPracticed(ui.profile);
      render();
    }
  },

  /* 역할극 진행 */
  playPartnerLine(){
    const s = getScenario(ui.profile, ui.scenarioId);
    const sess = ui.session;
    speak(s.lines[sess.idx].en, { onend: ()=>{
      if(ui.session!==sess || ui.view!=="scenario") return;
      App._advanceRole(s, sess);
    }});
  },
  nextRole(){
    const s = getScenario(ui.profile, ui.scenarioId);
    const sess = ui.session;
    sess.scores.push(sess.result? sess.result.pct : 0);
    App._advanceRole(s, sess);
  },
  _advanceRole(s, sess){
    sess.result = null; sess.heard = ""; sess.hint = false;
    if(sess.idx+1 < s.lines.length){
      sess.idx++;
      render();
      // 다음이 상대 대사면 자동 재생
      if(s.lines[sess.idx].s!=="B"){
        setTimeout(()=>{ if(ui.session===sess && ui.view==="scenario") App.playPartnerLine(); }, 350);
      }
    } else {
      sess.finished = true;
      const avg = sess.scores.length? Math.round(sess.scores.reduce((a,b)=>a+b,0)/sess.scores.length):0;
      setScenProg(ui.profile, s.id, "role", avg);
      markPracticed(ui.profile);
      render();
    }
  },
  toggleHint(){
    const sess = ui.session;
    if(sess.result) return;
    sess.hint = !sess.hint;
    render();
  },

  /* 패턴 연습 */
  openPattern(id){
    ui.patternId = id;
    const p = getPattern(id);
    ui.session = newPatSession(p);
    setupPatChips(ui.session, p);
    go("pattern");
  },
  pick(i){
    const sess = ui.session;
    if(sess.checked===true) return;
    sess.checked = null;
    const c = sess.chips[i];
    if(c.used) return;
    c.used = true;
    sess.picked.push(c);
    render();
  },
  unpick(i){
    const sess = ui.session;
    if(sess.checked===true) return;
    sess.checked = null;
    const c = sess.picked.splice(i,1)[0];
    c.used = false;
    render();
  },
  patCheck(){
    const p = getPattern(ui.patternId);
    const sess = ui.session;
    const target = p.examples[sess.exIdx].en.replace(/[.,!?]/g,"").split(/\s+/);
    const built = sess.picked.map(c=>c.w);
    sess.checked = target.length===built.length && target.every((w,i)=>w.toLowerCase()===built[i].toLowerCase());
    if(sess.checked){
      speak(p.examples[sess.exIdx].en);
      markPracticed("gio");
    }
    render();
  },
  patRetry(){
    const p = getPattern(ui.patternId);
    setupPatChips(ui.session, p);
    render();
  },
  patToSpeak(){
    ui.session.phase = "speak";
    ui.session.result = null; ui.session.heard = "";
    render();
  },
  patNext(score){
    const p = getPattern(ui.patternId);
    const sess = ui.session;
    sess.scores.push(score);
    if(sess.exIdx+1 < p.examples.length){
      sess.exIdx++;
      setupPatChips(sess, p);
      render();
    } else {
      sess.finished = true;
      const pct = Math.round(sess.scores.reduce((a,b)=>a+b,0)/sess.scores.length);
      store.profiles.gio.pat[p.id] = Math.max(store.profiles.gio.pat[p.id]||0, pct);
      markPracticed("gio");
      save();
      render();
    }
  },

  /* 리딩책 (레슨) */
  openBook(id){
    const b = BOOKS_BUILTIN.find(x=>x.id===id);
    const meta = ensureBookMeta(id, b? b.title : (store.books.find(x=>x.id===id)||{}).title || "내 책", !!b);
    const book = getBook(id);
    const ls = lessonsOf(book);
    if(!ls.length){ alert("책 내용을 불러오지 못했어요."); return; }
    ldoneOf(meta); save();
    ui.bookId = id;
    if(ls.length > 1) go("lessons");
    else App.openLesson(0);
  },
  openLesson(li){
    const book = getBook(ui.bookId);
    const ls = lessonsOf(book);
    if(!ls[li]) return;
    const meta = store.books.find(b=>b.id===ui.bookId);
    ui.li = li; ui.ltab = "read";
    const pages = pagesOf(book, ls[li]);
    const lp = meta.lpos;
    let pg = 0;
    if(lp && lp.li===li) pg = lp.pg!=null ? lp.pg : pageOfSent(pages, lp.s||0);
    ui.session = newReaderSession(Math.max(0, Math.min(pg, pages.length-1)));
    go("reader");
  },
  setLtab(t){ stopSpeak(); sttStop(); if(ui.session) ui.session.playing = false; ui.ltab = t; ui.scrollTop = "top"; render(); },
  rereadChapter(){ stopSpeak(); ui.session = newReaderSession(0); ui.ltab = "read"; ui.scrollTop = "top"; render(); },
  deleteBook(id){
    if(!confirm("이 책을 삭제할까요? (단어장은 남아요)")) return;
    store.books = store.books.filter(b=>b.id!==id);
    delete _bookCache[id];
    try{ localStorage.removeItem("english.book."+id); }catch(e){}
    clearLessonCache(id);
    save(); render();
  },
  /* 책 리더 */
  _bk(){ const book = getBook(ui.bookId); const L = lessonsOf(book)[ui.li]; return {book, L, pages:pagesOf(book, L), sents:lessonSents(book, L)}; },
  _clearSel(){ const s = ui.session; s.result = null; s.heard = ""; s.explain = null; s.savedWord = null; if(s.listening){ sttStop(); s.listening = false; } },
  _savePos(){ const meta = store.books.find(b=>b.id===ui.bookId); if(meta){ meta.lpos = {li:ui.li, pg:ui.session.pg}; save(); } },
  _select(i, w, wt){
    const sess = ui.session;
    if(sess.sel==null) sess.sheetIn = true;
    sess.sel = i; sess.selW = w || null; sess.selWt = wt || "";
    ui.revealSel = true;
  },
  _sayOpts(slow){ return {accent:store.settings.accent, rate: slow? 0.55 : (store.settings.rslow? 0.65 : undefined)}; },
  _turn(pg, dir){
    const sess = ui.session;
    const {pages} = App._bk();
    App.bookStop(true); App._clearSel(); stopSpeak();
    sess.pg = Math.max(0, Math.min(pages.length-1, pg)); sess.dir = dir; sess.sel = null; sess.selW = null;
    App._savePos(); markPracticed(ui.profile); save();
    ui.scrollTop = "book"; render();
  },
  pageNext(){
    const sess = ui.session;
    if(!sess || sess.kind!=="book" || sess.done) return;
    const {pages} = App._bk();
    if(sess.pg < pages.length-1){ App._turn(sess.pg+1, 1); return; }
    // 마지막 쪽까지 읽음 → 완독
    App.bookStop(true); App._clearSel(); stopSpeak();
    const meta = store.books.find(b=>b.id===ui.bookId);
    const ldone = ldoneOf(meta);
    ldone[ui.li] = Object.assign(ldone[ui.li]||{}, {read:1});
    meta.cur = Math.max(meta.cur||0, ui.li+1);
    meta.lpos = null;
    markPracticed(ui.profile); save();
    sess.done = true; sess.sel = null; sess.selW = null; sess.dir = 1;
    ui.scrollTop = "book"; render();
  },
  pagePrev(){
    const sess = ui.session;
    if(!sess || sess.kind!=="book") return;
    const {pages} = App._bk();
    if(sess.done){ sess.done = false; App._turn(pages.length-1, -1); return; }
    if(sess.pg > 0) App._turn(sess.pg-1, -1);
  },
  pageTap(ev){
    const sess = ui.session;
    const t = ev.target;
    if(!t.closest) return;
    const ks = t.closest(".ks");
    if(ks){ App.selSent(+ks.dataset.k); return; }
    // 크게 쓴 첫 글자(드롭캡)를 눌러도 첫 문장이 선택되게
    const sEl = t.closest(".s") || (t.closest(".para.drop") && t.closest(".para.drop").querySelector(".s"));
    if(!sEl) return;
    const i = +sEl.dataset.i;
    // the·and·Mr 같은 아주 쉬운 단어를 누르면 단어 카드 대신 문장 풀이
    let wEl = t.closest(".w");
    if(wEl && COMMON.has(wEl.dataset.w)) wEl = null;
    App.bookStop(true); App._clearSel();
    if(wEl){
      const w = wEl.dataset.w;
      if(sess.sel===i && sess.selW===w){ sess.selW = null; sess.selWt = ""; stopSpeak(); }
      else { App._select(i, w, wEl.textContent); speak(wEl.textContent, {accent:store.settings.accent}); }
    } else if(sess.sel===i && !sess.selW){
      sess.sel = null; stopSpeak();
    } else {
      App._select(i);
      speak(curSents()[i], App._sayOpts());
    }
    render();
  },
  selSent(i){
    App.bookStop(true); App._clearSel(); App._select(i);
    speak(curSents()[i], App._sayOpts());
    render();
  },
  closeSel(){
    const sess = ui.session;
    if(!sess || sess.sel==null) return;
    App._clearSel(); stopSpeak();
    sess.sel = null; sess.selW = null;
    render();
  },
  stepSel(d){
    const sess = ui.session;
    const {pages, sents} = App._bk();
    const n = (sess.sel==null? -1 : sess.sel) + d;
    if(n < 0) return;
    if(n >= sents.length){ App.closeSel(); return; }
    App.bookStop(true); App._clearSel();
    const pg = pageOfSent(pages, n);
    if(pg !== sess.pg){ sess.pg = pg; sess.dir = d; App._savePos(); }
    App._select(n);
    speak(sents[n], App._sayOpts());
    render();
  },
  saySel(slow){ const s = curSents()[ui.session.sel]; if(s) speak(s, App._sayOpts(slow)); },
  sayW(){ const s = ui.session; const t = s.selWt || s.selW; if(t) speak(t, {accent:store.settings.accent}); },
  sayChunk(j){ const ss = ldSent(curLD(), ui.session.sel); const c = ss && ss.c && ss.c[j]; if(c) speak(c[0], App._sayOpts()); },
  sayGW(j){ const ss = ldSent(curLD(), ui.session.sel); const g = ss && ss.g && ss.g[j]; if(g) speak(g.w, {accent:store.settings.accent}); },
  addGW(j){ const ss = ldSent(curLD(), ui.session.sel); const g = ss && ss.g && ss.g[j]; if(g) App._addVocab(g.w, g.ko); },
  addVocabW(){
    const sess = ui.session;
    if(!sess.selW) return;
    const ld = curLD();
    const info = lookupWord(sess.selW, sess.sel, ld, dayDict(ld));
    App._addVocab(sess.selW, info? info.ko : "");
  },
  _addVocab(w, ko){
    w = wkey(w);
    if(!w) return;
    const v = store.vocab.find(x=>x.w===w);
    if(v){ if(!v.ko && ko) v.ko = ko; }
    else store.vocab.push({w, ko:ko||"", at:todayStr()});
    if(ui.session) ui.session.savedWord = w;
    save(); render();
  },
  async askWord(){
    const sess = ui.session;
    if(!sess.selW || sess.askBusy || ui.aiBusy) return;
    const key = sess.selW, word = sess.selWt || sess.selW;
    const s = curSents()[sess.sel] || "";
    sess.askBusy = true; ui.aiBusy = true; render();
    try{
      const rep = await callAPI(WORD_PROMPT, [{role:"user", content:"Word: "+word+"\nSentence: "+s}], 300, {json:true});
      const d = JSON.parse(rep.slice(rep.indexOf("{"), rep.lastIndexOf("}")+1));
      if(!store.wdict) store.wdict = {};
      store.wdict[key] = {p:cleanTxt(d.p).replace(/^\[|\]$/g,""), ko:cleanTxt(d.ko)};
      const ks = Object.keys(store.wdict);
      if(ks.length > 3000) delete store.wdict[ks[0]];
      save();
    }catch(e){ alert("뜻을 가져오지 못했어요: "+(e.message||e)); }
    sess.askBusy = false; ui.aiBusy = false;
    if(ui.session===sess) render();
  },
  setRtab(t){ ui.session.rtab = t; render(); },
  toggleFull(){ const s = ui.session; s.rtab = s.rtab==="full" ? "sent" : "full"; render(); },
  toggleHints(){ store.settings.hints = !store.settings.hints; save(); render(); },
  toggleMore(){ ui.session.more = !ui.session.more; render(); },
  setSlow(b){ store.settings.rslow = !!b; save(); render(); },
  fontStep(d){ const f = store.settings.rfont==null? 1 : store.settings.rfont; store.settings.rfont = Math.max(0, Math.min(3, f+d)); save(); render(); },
  setAccent(a){
    store.settings.accent = a; save(); render();
    const sess = ui.session;
    if(ui.view==="reader" && ui.ltab==="read" && sess && sess.kind==="book" && !sess.done){
      const {pages, sents} = App._bk();
      const s = sents[sess.sel!=null? sess.sel : pages[sess.pg][0].i];
      if(s) speak(s, {accent:a});
    }
  },
  bookPlay(){
    const sess = ui.session;
    const {pages, sents} = App._bk();
    App._clearSel();
    let i = sess.sel!=null ? sess.sel : pages[sess.pg][0].i;
    sess.sel = null; sess.selW = null;
    sess.playing = true;
    const step = ()=>{
      if(!sess.playing || ui.session!==sess || ui.view!=="reader" || ui.ltab!=="read") return;
      if(i >= sents.length){ sess.playing = false; sess.playIdx = null; markPracticed(ui.profile); save(); render(); return; }
      const pg = pageOfSent(pages, i);
      if(pg !== sess.pg){ sess.pg = pg; sess.dir = 1; App._savePos(); ui.scrollTop = "book"; }
      sess.playIdx = i; ui.revealPlay = true;
      render();
      const idx = i;
      speak(sents[idx], Object.assign(App._sayOpts(), {
        onword: ci=>markReadingWord(idx, ci),
        onend: ()=>{ if(!sess.playing || ui.session!==sess) return; i = idx+1; setTimeout(step, 380); }
      }));
    };
    step();
  },
  bookStop(silent){
    const sess = ui.session;
    if(!sess || !sess.playing) return;
    sess.playing = false; sess.playIdx = null; stopSpeak();
    if(!silent) render();
  },
  tapChapWord(i){
    const sess = ui.session;
    const w = sess.cw && sess.cw[i];
    if(!w) return;
    speak(w, {accent:store.settings.accent});
    if(!store.vocab.some(v=>v.w===w)) store.vocab.push({w, ko:"", at:todayStr()});
    sess.savedWord = w;
    save(); render();
  },
  sayLessonWord(i){
    const ld = curLD();
    const x = ld && ld.words && ld.words[i];
    if(x) speak(String(x.w), {accent:store.settings.accent});
  },
  saveLessonWords(){
    const ld = curLD();
    if(!ld || !ld.words) return;
    let n = 0;
    ld.words.forEach(x=>{
      const w = String(x.w).toLowerCase();
      if(!store.vocab.some(v=>v.w===w)){ store.vocab.push({w, ko:x.ko||"", at:todayStr()}); n++; }
    });
    save();
    alert(n? n+"개 단어를 내 단어장에 담았어요!" : "이미 모두 담겨 있어요!");
  },
  sayVocab(i){ const v = store.vocab[i]; if(v) speak(v.w, {accent:store.settings.accent}); },
  removeVocab(i){ store.vocab.splice(i,1); save(); render(); },
  toggleVocab(){ ui.showVocab = !ui.showVocab; render(); },
  togglePaste(){ ui.showPaste = !ui.showPaste; render(); },
  async addBookFile(input){
    const f = input.files && input.files[0];
    if(!f) return;
    const isPdf = /\.pdf$/i.test(f.name) || f.type==="application/pdf";
    if(f.size > (isPdf? 25 : 2)*1024*1024){ alert(isPdf? "PDF가 너무 커요 (25MB 이하)." : "파일이 너무 커요 (2MB 이하)."); input.value=""; return; }
    ui.importing = true; render();
    try{
      const text = isPdf? await extractPdfText(f) : await f.text();
      ui.importing = false;
      if(isPdf && text.replace(/\s/g,"").length < 40){
        alert("이 PDF에서 글자를 찾지 못했어요 😢\n사진으로 찍은(스캔) PDF는 읽을 수 없어요. 글자를 복사할 수 있는 PDF나 .txt 파일을 써 주세요.");
        render();
      } else App._saveBook(f.name.replace(/\.[^.]+$/,""), text);
    }catch(e){
      ui.importing = false;
      alert("파일을 읽지 못했어요: " + (e.message||e) + (isPdf? "\n\n안 되면 PDF 내용을 복사해서 '글 붙여넣기'로 넣어주세요." : ""));
      render();
    }
    input.value = "";
  },
  savePastedBook(){
    const title = ($("pasteTitle")||{}).value || "";
    const text = ($("pasteText")||{}).value || "";
    App._saveBook(title.trim() || "내 책", text);
  },
  _saveBook(title, text){
    const chapters = parseBook(text);
    const total = chapters.reduce((a,c)=>a+c.sents.length, 0);
    if(total < 3){ alert("텍스트를 읽지 못했어요. 영어 문장이 들어있는지 확인해 주세요."); render(); return; }
    const id = "bk"+Date.now();
    const book = {v:3, chapters};
    try{
      localStorage.setItem("english.book."+id, JSON.stringify(book));
    }catch(e){ alert("저장 공간이 부족해요. 안 읽는 책을 삭제하고 다시 시도해 주세요."); render(); return; }
    _bookCache[id] = book;
    store.books.push({id, title, builtin:false, pos:{c:0,s:0}, quiz:{}, ldone:{}, cur:0, addedAt:todayStr()});
    ui.showPaste = false;
    save();
    App.openBook(id);
  },
  async genLesson(){
    if(ui.aiBusy) return;
    const bookId = ui.bookId, li = ui.li;
    const sents = curSents();
    if(!sents.length) return;
    ui.aiBusy = true; ui.genLoading = true; render();
    try{
      const numbered = sents.map((s,i)=>(i+1)+". "+s).join("\n");
      const rep = await callAPI(LESSON_PROMPT, [{role:"user", content:numbered}], 9000, {json:true});
      const data = parseLessonJSON(rep, sents.length);
      data.sig = lessonSig(sents); data.at = Date.now();
      if(!setLessonData(bookId, li, data)) throw new Error("저장 공간이 부족해요");
      markPracticed(ui.profile);
    }catch(e){
      alert("레슨을 만들지 못했어요: "+(e.message||e));
    }
    ui.aiBusy = false; ui.genLoading = false;
    render();
  },
  async explainSent(){
    if(ui.aiBusy) return;
    const sess = ui.session;
    const i = sess.sel, s = curSents()[i];
    if(!s) return;
    ui.aiBusy = true; sess.explaining = true; render();
    try{
      const rep = await callAPI(EXPLAIN_PROMPT, [{role:"user", content:s}]);
      if(ui.session===sess && sess.sel===i) sess.explain = rep.replace(/[*_`#]+/g,"");
    }catch(e){
      if(ui.session===sess && sess.sel===i) sess.explain = "⚠️ "+(e.message||"설명을 가져오지 못했어요.");
    }
    ui.aiBusy = false;
    if(ui.session===sess){ sess.explaining = false; render(); }
  },

  /* 레슨 퀴즈 */
  startQuiz(){
    const sents = curSents();
    const ld = curLD();
    let qs = buildQuizSents(sents, ld? 4 : 8);
    if(ld && Array.isArray(ld.quiz)){
      const aiQs = ld.quiz.filter(x=>x && x.q && Array.isArray(x.opts) && x.opts.length>=2 && typeof x.a==="number")
        .map(x=>({type:"comp", q:String(x.q), opts:x.opts.map(String), ans:Math.min(x.a, x.opts.length-1)}));
      qs = shuffle(qs.concat(aiQs)).slice(0,8);
    }
    if(qs.length < 3){ alert("이 레슨은 퀴즈를 만들 문장이 조금 부족해요."); return; }
    ui.session = { kind:"quiz", qs, qi:0, score:0, phase:"q", sel:null, picked:[], chips:[], orderOk:false };
    App._prepQ();
    go("quiz");
  },
  backToLesson(){
    App.openLesson(ui.li);
    ui.ltab = "quiz";
    render();
  },
  _prepQ(){
    const sess = ui.session;
    const q = sess.qs[sess.qi];
    sess.phase = "q"; sess.sel = null; sess.orderOk = false;
    if(q.type==="order"){
      const words = q.target.replace(/[.,!?"“”]/g,"").split(/\s+/).filter(Boolean);
      sess.chips = shuffle(words.map((w,i)=>({w, i, used:false})));
      if(words.length>2 && sess.chips.every((c,i)=>c.i===i)) sess.chips = shuffle(sess.chips);
      sess.picked = [];
    }
    if(q.type==="listen"){ setTimeout(()=>{ if(ui.session===sess) speak(q.target, {accent:store.settings.accent}); }, 350); }
  },
  qReplay(){
    const q = ui.session.qs[ui.session.qi];
    if(q && q.target) speak(q.target, {accent:store.settings.accent});
  },
  qPick(i){
    const sess = ui.session;
    if(sess.phase!=="q") return;
    const q = sess.qs[sess.qi];
    sess.sel = i;
    sess.phase = "a";
    if(i===q.ans) sess.score++;
    if(q.type==="cloze") speak(q.text, {accent:store.settings.accent});
    if(q.type==="listen") stopSpeak();
    render();
  },
  qChipPick(i){
    const sess = ui.session;
    if(sess.phase!=="q") return;
    const c = sess.chips[i];
    if(c.used) return;
    c.used = true; sess.picked.push(c);
    render();
  },
  qChipUn(i){
    const sess = ui.session;
    if(sess.phase!=="q") return;
    const c = sess.picked.splice(i,1)[0];
    c.used = false;
    render();
  },
  qOrderCheck(){
    const sess = ui.session;
    const q = sess.qs[sess.qi];
    const target = q.target.replace(/[.,!?"“”]/g,"").split(/\s+/).filter(Boolean);
    const built = sess.picked.map(c=>c.w);
    sess.orderOk = built.length===target.length && target.every((w,i)=>w===built[i]);
    sess.phase = "a";
    if(sess.orderOk) sess.score++;
    speak(q.target, {accent:store.settings.accent});
    render();
  },
  qNext(){
    const sess = ui.session;
    stopSpeak();
    sess.qi++;
    if(sess.qi >= sess.qs.length){
      sess.phase = "done";
      const pct = Math.round(sess.score/sess.qs.length*100);
      const meta = store.books.find(b=>b.id===ui.bookId);
      const ldone = ldoneOf(meta);
      const cur = ldone[ui.li]||{};
      ldone[ui.li] = Object.assign(cur, {quiz: Math.max(cur.quiz||0, pct)});
      markPracticed(ui.profile);
      save();
    } else {
      App._prepQ();
    }
    render();
  },

  /* AI 채팅 */
  startInClaude(kind, id, gender){
    const text = claudePrompt(kind, id, gender);
    copyText(text); // 미리 채우기가 실패해도 붙여넣을 수 있게 복사해 둔다
    window.open("https://claude.ai/new?q=" + encodeURIComponent(text), "_blank", "noopener");
  },
  setChatMode(m){
    const prof = store.profiles.dad;
    if(chatMetaOf("dad").mode===m) return;
    if(prof.chat.length && !confirm("모드를 바꾸면 대화를 새로 시작해요. 계속할까요?")) return;
    prof.chatMeta = {mode:m};
    prof.chat = [];
    ui.hints = null;
    save(); render();
  },
  pickPersona(id, g){
    const prof = store.profiles.dad;
    const p = personaById(id);
    prof.chatMeta = {mode:"buddy", personaId:id, gender:g};
    prof.chat = [{role:"assistant", content:p.opener}];
    ui.hints = null;
    save(); render(); scrollChat();
    if(store.settings.autoSpeak) speak(p.opener);
  },
  changeBuddy(){
    const prof = store.profiles.dad;
    if(prof.chat.length>1 && !confirm("친구를 바꾸면 대화를 새로 시작해요. 계속할까요?")) return;
    prof.chatMeta = {mode:"buddy"};
    prof.chat = [];
    ui.hints = null;
    save(); render();
  },
  pickBiz(id){
    const prof = store.profiles.dad;
    const r = BIZ_ROLEPLAYS.find(x=>x.id===id);
    prof.chatMeta = {mode:"biz", rpId:id};
    prof.chat = [{role:"assistant", content:r.opener}];
    ui.hints = null;
    save(); render(); scrollChat();
    if(store.settings.autoSpeak) speak(r.opener);
  },
  changeBiz(){
    const prof = store.profiles.dad;
    if(prof.chat.length>1 && !confirm("시나리오를 바꾸면 대화를 새로 시작해요. 계속할까요?")) return;
    prof.chatMeta = {mode:"biz"};
    prof.chat = [];
    ui.hints = null;
    save(); render();
  },
  async sendChat(){
    if(ui.aiBusy) return;
    const ta = $("chatText");
    if(!ta) return;
    const text = ta.value.trim();
    if(!text) return;
    const pid = ui.profile;
    const chat = store.profiles[pid].chat;
    chat.push({role:"user", content:text});
    if(chat.length>60) store.profiles[pid].chat = chat.slice(-60);
    save();
    ta.value = "";
    ui.hints = null;
    render(); scrollChat();
    const typing = $("typing");
    if(typing) typing.innerHTML = '<div class="typing">💭 생각 중...</div>';
    ui.aiBusy = true;
    try{
      const reply = await chatReply(pid);
      store.profiles[pid].chat.push({role:"assistant", content:reply});
      markPracticed(pid);
      save();
      ui.aiBusy = false;
      render(); scrollChat();
      if(store.settings.autoSpeak){
        // 💡 교정 줄(한국어 포함)은 읽지 않는다
        const spoken = reply.split("\n").filter(l=>!l.trim().startsWith("💡")).join(" ");
        if(spoken) speak(spoken);
      }
    }catch(e){
      ui.aiBusy = false;
      const t2 = $("typing");
      if(t2) t2.innerHTML = '<div class="notice">⚠️ '+esc(e.message||"연결에 실패했어요. 인터넷을 확인해 주세요.")+'</div>';
    }
  },
  async getHints(){
    if(ui.aiBusy) return;
    const pid = ui.profile;
    if(!store.profiles[pid].chat.filter(m=>!m.sys).length){ alert("대화를 먼저 시작해 보세요!"); return; }
    ui.aiBusy = true;
    const typing = $("typing");
    if(typing) typing.innerHTML = '<div class="typing">💡 힌트 만드는 중...</div>';
    try{
      const text = await callAPI(HINT_PROMPT, [{role:"user",
        content:"Transcript:\n"+transcriptOf(pid)+"\n\nGive 3 reply suggestions for the Learner (easy, medium, challenging)."}]);
      ui.hints = text.split("\n").map(s=>s.replace(/^[-•*\d.)\s]+/,"").trim()).filter(Boolean).slice(0,3);
      ui.aiBusy = false;
      render(); scrollChat();
    }catch(e){
      ui.aiBusy = false;
      const t2 = $("typing");
      if(t2) t2.innerHTML = '<div class="notice">⚠️ '+esc(e.message)+'</div>';
    }
  },
  useHint(i){
    ui.pendingInput = ui.hints && ui.hints[i] ? ui.hints[i] : null;
    ui.hints = null;
    render();
    ui.pendingInput = null;
    const ta = $("chatText"); if(ta) ta.focus();
  },
  async getReport(){
    if(ui.aiBusy) return;
    const pid = ui.profile;
    const userTurns = store.profiles[pid].chat.filter(m=>!m.sys && m.role==="user").length;
    if(userTurns<2){ alert("두세 마디 이상 대화한 뒤에 리포트를 받아보세요!"); return; }
    ui.aiBusy = true;
    const typing = $("typing");
    if(typing) typing.innerHTML = '<div class="typing">📋 리포트 작성 중...</div>';
    try{
      const rep = await callAPI(REPORT_PROMPT, [{role:"user", content:"Transcript:\n"+transcriptOf(pid)}]);
      store.profiles[pid].chat.push({role:"assistant", content:"📋 오늘의 스피킹 리포트\n\n"+rep, sys:true});
      save();
      ui.aiBusy = false;
      render(); scrollChat();
    }catch(e){
      ui.aiBusy = false;
      const t2 = $("typing");
      if(t2) t2.innerHTML = '<div class="notice">⚠️ '+esc(e.message)+'</div>';
    }
  },
  chatMic(){
    const btn = $("chatMic");
    if(recActive){ sttStop(); return; }
    if(btn) btn.classList.add("rec");
    sttStart({
      onInterim(t){ const ta = $("chatText"); if(ta) ta.value = t; },
      onEnd(finalText){
        if(btn) btn.classList.remove("rec");
        const ta = $("chatText");
        if(ta && finalText){ ta.value = finalText; App.sendChat(); }
      },
      onError(err){
        if(btn) btn.classList.remove("rec");
        if(err==="not-allowed") alert("마이크 권한이 필요해요.");
      }
    });
  },
  speakMsg(i){
    const m = store.profiles[ui.profile].chat[i];
    if(!m) return;
    const spoken = m.content.split("\n").filter(l=>!l.trim().startsWith("💡")).join(" ");
    speak(spoken);
  },
  clearChat(){
    if(!confirm("대화 내용을 지울까요?")) return;
    const pid = ui.profile;
    store.profiles[pid].chat = [];
    ui.hints = null;
    // 오프닝이 있는 모드는 다시 첫 인사부터 시작
    const meta = chatMetaOf(pid);
    if(pid==="gio"){
      store.profiles.gio.chat.push({role:"assistant", content:"Woof woof! Hi! I'm Coco! 🐶 What's your name?"});
    } else if(meta.mode==="buddy" && meta.personaId){
      store.profiles.dad.chat.push({role:"assistant", content:personaById(meta.personaId).opener});
    } else if(meta.mode==="biz" && meta.rpId){
      store.profiles.dad.chat.push({role:"assistant", content:BIZ_ROLEPLAYS.find(x=>x.id===meta.rpId).opener});
    }
    save(); render(); scrollChat();
  },

  /* 설정 */
  setRate(v){ store.settings.rate = parseFloat(v); save(); },
  setVoice(v){ store.settings.voiceURI = v; save(); },
  setApiKey(v){
    // 폰에서 붙여넣을 때 섞이는 공백·줄바꿈 제거
    store.settings.apiKey = v.replace(/\s+/g,"");
    // 키 종류가 바뀌면 그 공급자의 기본 모델로 맞춘다
    const list = providerModels();
    if(!list.some(m=>m.id===store.settings.model)) store.settings.model = list[0].id;
    save(); render();
  },
  setModel(v){ store.settings.model = v; save(); },
  toggleAutoSpeak(){ store.settings.autoSpeak = !store.settings.autoSpeak; save(); render(); },
  exportData(){
    const blob = new Blob([JSON.stringify(store, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "english-backup-"+todayStr()+".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  },
  importData(){
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json";
    input.onchange = ()=>{
      const f = input.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed.profiles) throw new Error("형식이 다른 파일이에요.");
          store = Object.assign(defaultStore(), parsed);
          save();
          alert("가져오기 완료!");
          render();
        }catch(e){ alert("가져오기에 실패했어요: "+e.message); }
      };
      reader.readAsText(f);
    };
    input.click();
  },
  resetData(){
    if(!confirm("모든 학습 기록과 설정이 지워져요. 정말 초기화할까요?")) return;
    store = defaultStore();
    save(); go("home");
  }
};
window.App = App;

function speakFeedbackTone(good){ /* 자리표시자: 지금은 소리 없이 시각 피드백만 사용 */ }

/* 책 리더: ← → 키, 옆으로 밀기로 쪽 넘기기 */
function readingBook(){ return ui.view==="reader" && ui.ltab==="read" && ui.session && ui.session.kind==="book"; }
document.addEventListener("keydown", e=>{
  if(!readingBook() || (e.target.closest && e.target.closest("input,textarea,select"))) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); App.pageNext(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); App.pagePrev(); }
  else if(e.key==="Escape") App.closeSel();
});
let _swipe = null;
document.addEventListener("touchstart", e=>{
  const t = e.touches[0];
  _swipe = (readingBook() && e.target.closest && e.target.closest(".pg-l")) ? {x:t.clientX, y:t.clientY, at:Date.now()} : null;
}, {passive:true});
document.addEventListener("touchend", e=>{
  if(!_swipe || !readingBook()) return;
  const t = e.changedTouches[0], dx = t.clientX - _swipe.x, dy = t.clientY - _swipe.y;
  if(Math.abs(dx) > 70 && Math.abs(dy) < 50 && Date.now() - _swipe.at < 700){ if(dx < 0) App.pageNext(); else App.pagePrev(); }
  _swipe = null;
}, {passive:true});

render();
</script>
