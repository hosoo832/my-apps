<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>DualTalk AI — 우리집 영어회화</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --blue:#2563eb; --blue-soft:#dbeafe; --orange:#f97316; --orange-soft:#ffedd5;
  --green:#16a34a; --green-soft:#dcfce7; --red:#dc2626; --red-soft:#fee2e2;
  --violet:#7c3aed; --amber:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.4rem} h2{font-size:1.15rem} h3{font-size:1rem}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{font-size:1.3rem;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.topbar .title{flex:1;font-weight:700;font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--sub);font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;font-weight:700;font-size:1rem;transition:transform .05s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%;margin-top:8px}
.btn:disabled{opacity:.4}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.orange{background:var(--orange-soft);color:#c2410c}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.gray{background:#f1f5f9;color:var(--sub)}
/* home */
.profile-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.profile-card:active{transform:scale(.98)}
.avatar{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.avatar.dad{background:var(--blue-soft)} .avatar.gio{background:var(--orange-soft)}
.profile-card .info{flex:1}
.profile-card .name{font-weight:800;font-size:1.15rem}
.profile-card .desc{color:var(--sub);font-size:.85rem;margin-top:2px}
.stats-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:20px;color:#fff;padding:22px;margin-bottom:16px}
.hero p{opacity:.85;font-size:.9rem;margin-top:4px}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#eef2f7;padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* scenario list */
.scen-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.scen-item .emoji{font-size:1.5rem}
.scen-item .t{flex:1}
.scen-item .t .en{font-weight:700}
.scen-item .t .ko{color:var(--sub);font-size:.8rem}
.progress-dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.progress-dot.done{background:var(--green)}
.pct{font-size:.78rem;font-weight:800;color:var(--sub);min-width:36px;text-align:right}
.pct.good{color:var(--green)}
/* dialogue */
.dlg-line{display:flex;gap:8px;margin-bottom:10px}
.dlg-line.me{flex-direction:row-reverse}
.bubble{max-width:82%;padding:10px 13px;border-radius:14px;background:#eef2f7;font-size:.95rem;line-height:1.45}
.dlg-line.me .bubble{background:var(--blue-soft)}
.dlg-line.gio.me .bubble{background:var(--orange-soft)}
.bubble .ko{display:block;color:var(--sub);font-size:.78rem;margin-top:4px}
.bubble.now{outline:2px solid var(--blue)}
.speaker-tag{font-size:.7rem;color:var(--sub);align-self:flex-end;flex-shrink:0}
/* practice */
.practice-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.practice-box .target{font-size:1.25rem;font-weight:700;line-height:1.5;margin:10px 0}
.practice-box .target-ko{color:var(--sub);margin-bottom:8px}
.word-ok{color:var(--green)} .word-miss{color:var(--red);text-decoration:underline}
.mic-btn{width:76px;height:76px;border-radius:50%;background:var(--blue);color:#fff;font-size:2rem;
  display:inline-flex;align-items:center;justify-content:center;margin:12px auto;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.mic-btn.rec{background:var(--red);animation:pulse 1s infinite}
.mic-btn.orange{background:var(--orange);box-shadow:0 6px 18px rgba(249,115,22,.35)}
.mic-btn.orange.rec{background:var(--red)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.heard{background:#f1f5f9;border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--sub);min-height:38px;margin-top:8px}
.score-big{font-size:2.2rem;font-weight:900;margin:6px 0}
.score-big.good{color:var(--green)} .score-big.mid{color:var(--amber)} .score-big.bad{color:var(--red)}
.step-ind{display:flex;gap:4px;justify-content:center;margin-bottom:10px}
.step-ind i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.step-ind i.on{background:var(--blue)} .step-ind i.done{background:var(--green)}
.blurred{filter:blur(6px);transition:filter .2s;user-select:none}
.blurred.show{filter:none}
/* reading */
.rword{cursor:pointer;border-radius:6px;padding:1px 3px}
.rword.sel{background:var(--orange-soft);outline:1px solid var(--orange)}
.rbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.rbar i{display:block;height:100%;background:var(--green)}
.scen-item{cursor:pointer}
.qopt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:.95rem}
.qopt.ok{border-color:var(--green);background:var(--green-soft)}
.qopt.no{border-color:var(--red);background:var(--red-soft)}
.wchip{display:inline-block;background:#fff;border:1.5px solid var(--violet);color:var(--violet);border-radius:999px;padding:5px 12px;margin:3px 2px;font-weight:700;font-size:.88rem}
/* 레슨 */
.lart{border-radius:16px;overflow:hidden;line-height:0;margin-bottom:10px;border:1px solid var(--line)}
.rword.hl{background:#fef3c7;border-bottom:2px solid #f59e0b;border-radius:4px}
.wpop{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;margin-top:10px;text-align:left}
.ltabs{display:flex;gap:6px;margin:10px 0}
.ltabs button{flex:1;padding:8px 2px;border-radius:999px;font-weight:700;font-size:.82rem;background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.ltabs button.on{border-color:var(--orange);background:var(--orange-soft);color:#9a3412}
.vrow{display:flex;align-items:baseline;gap:8px;padding:9px 2px;border-bottom:1px dashed var(--line);text-align:left}
.vrow:last-child{border-bottom:none}
.vrow .w{font-weight:800;min-width:90px}
.vrow .p{color:#b45309;font-size:.8rem}
.vrow .ko{color:var(--ink);font-size:.9rem;flex:1}
.daylabel{text-align:center;letter-spacing:4px;color:var(--sub);font-size:.72rem;font-weight:700;margin-top:2px}
.lesson-title{text-align:center;font-size:1.25rem;font-weight:800;margin:2px 0 6px}
/* pattern chips */
.chip-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;min-height:44px}
.word-chip{padding:10px 16px;border-radius:12px;background:#fff;border:2px solid var(--orange);
  font-weight:700;font-size:1.05rem;color:#c2410c}
.word-chip:disabled{opacity:.25}
.built{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px;
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0}
.built .word-chip{border-color:var(--line);color:var(--ink);padding:8px 12px}
.built.ok{border-color:var(--green);background:var(--green-soft)}
.built.no{border-color:var(--red);background:var(--red-soft)}
/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:340px}
.chat-log{flex:1;overflow-y:auto;padding:4px 2px}
.chat-msg{display:flex;margin-bottom:10px}
.chat-msg.user{justify-content:flex-end}
.chat-msg .b{max-width:85%;padding:10px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);
  font-size:.95rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.chat-msg.user .b{background:var(--blue-soft);border-color:transparent}
.chat-msg .speak-again{font-size:.75rem;color:var(--sub);margin-top:4px}
.chat-input{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.chat-input textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;height:46px;background:#fff}
.chat-mic{width:46px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;flex-shrink:0}
.chat-mic.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1s infinite}
.chat-send{width:46px;height:46px;border-radius:12px;background:var(--blue);color:#fff;font-size:1.1rem;flex-shrink:0}
.typing{color:var(--sub);font-size:.85rem;padding:4px}
/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row label{font-weight:600;font-size:.95rem}
.set-row select,.set-row input[type=text],.set-row input[type=password]{
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:56%;background:#fff}
.key-expr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.key-expr:last-child{border-bottom:none}
.key-expr .ko{color:var(--sub);font-size:.8rem}
.key-expr .play{font-size:1rem;padding:4px 8px;border-radius:8px;background:#f1f5f9;flex-shrink:0}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 13px;font-size:.85rem;margin-bottom:12px}
.center{text-align:center}
/* ===== 책 리더 (왼쪽 원서 · 오른쪽 풀이) ===== */
#app.wide{max-width:1180px}
.narrowcol{max-width:600px;margin:0 auto}
.rd-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:-6px 0 6px}
.rd-title{display:flex;align-items:baseline;gap:10px;flex:1 1 260px;min-width:0}
.rd-day{font-weight:900;letter-spacing:2px;color:#b45309;font-size:.82rem;white-space:nowrap}
.rd-day small{color:var(--sub);letter-spacing:0;font-weight:700}
.rd-ch{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-ch small{color:var(--sub);font-weight:600}
.rd-head .ltabs{flex:1 1 420px;margin:0}
.bk-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 10px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.88rem;color:var(--ink);white-space:nowrap}
.tool.on{border-color:var(--orange);background:var(--orange-soft);color:#9a3412}
.tool.mic{border-color:#fdba74;color:#c2410c}
.tool.mic.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
.seg{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg em{font-style:normal;font-size:.72rem;color:var(--sub);padding:0 4px 0 11px;font-weight:700}
.seg button{padding:7px 11px;font-weight:700;font-size:.82rem;color:var(--sub)}
.seg button.on{background:var(--orange);color:#fff}
.seg button:disabled{opacity:.35}
.bk-more{display:contents}
.more-btn{display:none}
.book{position:relative;display:flex;align-items:stretch;background:#fffdf7;border:1px solid #eadfc6;border-radius:20px;
  box-shadow:0 16px 34px -14px rgba(120,82,30,.30),0 2px 0 #f3ead6;margin-bottom:12px}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:46px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,rgba(120,85,30,0),rgba(120,85,30,.08) 40%,rgba(120,85,30,.17) 50%,rgba(120,85,30,.08) 60%,rgba(120,85,30,0))}
.book.turn-next .pg-l,.book.turn-next .pg-r{animation:pgNext .28s ease}
.book.turn-prev .pg-l,.book.turn-prev .pg-r{animation:pgPrev .28s ease}
@keyframes pgNext{from{opacity:.25;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes pgPrev{from{opacity:.25;transform:translateX(-22px)}to{opacity:1;transform:none}}
.pg{position:relative;flex:1 1 50%;min-width:0;padding:28px 40px 52px}
.pg-art{margin:-6px -10px 12px;border-radius:14px;overflow:hidden;line-height:0;box-shadow:0 2px 10px rgba(60,40,10,.12)}
.pg-art svg{display:block;width:100%;height:clamp(110px,14vw,160px)}
.chap-h{text-align:center;margin:2px 0 14px}
.chap-n{font-size:.72rem;font-weight:800;letter-spacing:.26em;color:#b45309;text-transform:uppercase}
.chap-t{font-family:Georgia,"Noto Serif","Times New Roman",serif;font-size:1.5rem;font-weight:700;color:#3b2a16;margin-top:2px;line-height:1.25}
.txt{font-family:Georgia,"Noto Serif","Times New Roman",serif;color:#2a1f14;font-size:1.28rem;line-height:1.95;text-align:left}
.fs0 .txt{font-size:1.1rem}.fs2 .txt{font-size:1.46rem}.fs3 .txt{font-size:1.66rem}
.para{text-indent:1.4em;margin:0 0 .45em}
.para.cont,.para.drop,.para.nb{text-indent:0}
.para.drop::first-letter{float:left;font-size:3.1em;line-height:.85;padding:.06em .1em 0 0;color:#b45309;font-weight:700}
.s{border-radius:5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.06em 0;transition:background .15s;cursor:pointer}
.s.sel{background:#ffe49a}
.s.play{background:#d4f0de}
.w{border-radius:4px}
.w.kw{border-bottom:2.5px dotted #f59e0b}
.w.wsel{background:#f59e0b;color:#fff}
.w.rd{background:#86efac}
.spk{font-family:-apple-system,"Segoe UI","Noto Sans KR",sans-serif;font-size:.74em;font-weight:800;color:#6d28d9;background:#f1e8ff;border-radius:6px;padding:1px 7px;vertical-align:.1em}
.book.hints .txt{line-height:2.45}
ruby{ruby-position:over}
rt{font-family:-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;font-size:.46em;color:#c2410c;font-weight:700;letter-spacing:0;text-indent:0}
.kp{display:none}
.pno{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-family:Georgia,serif;font-size:.85rem;color:#b8a582}
.pg-r{font-size:.95rem;background:linear-gradient(90deg,rgba(120,85,30,.035),rgba(120,85,30,0) 26%)}
.rp-in{position:sticky;top:12px}
.rp-tabs{display:flex;gap:6px;margin-bottom:12px}
.rp-tabs button{flex:1;padding:8px 6px;border-radius:999px;font-weight:800;font-size:.84rem;border:1.5px solid #eadfc6;background:#fff;color:var(--sub)}
.rp-tabs button.on{background:#fff2d6;border-color:#f59e0b;color:#92400e}
.book.full .rp-detail,.book.full .rp-guide{display:none}
.book:not(.full) .rp-fullko{display:none}
.rp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rp-num{font-size:.75rem;font-weight:800;color:#b45309;letter-spacing:.04em}
.rp-x{width:32px;height:32px;border-radius:50%;background:#f4ecdc;font-size:.9rem;color:#7c6a4d}
.rp-en{font-family:Georgia,"Noto Serif",serif;font-size:1.12rem;line-height:1.6;color:#2a1f14;background:#fff;border:1px solid #efe2c4;border-radius:12px;padding:10px 12px}
.rp-btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.rp-box{background:#fff;border:1px solid #efe2c4;border-radius:14px;padding:10px 12px;margin-top:10px}
.rp-h{font-size:.78rem;font-weight:800;color:#92400e;margin-bottom:6px}
.rp-h .muted{font-weight:600;font-size:.72rem;margin-left:4px}
.rp-ko{font-size:1.02rem;line-height:1.65;color:#1f2937}
.chunks{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ck{display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:10px;padding:5px 9px;border:1.5px solid #fcd34d;background:#fff}
.ck b{font-family:Georgia,"Noto Serif",serif;font-weight:600;font-size:.95rem;color:#2a1f14}
.ck i{font-style:normal;font-size:.8rem;margin-top:1px;color:#b45309}
.ck1{border-color:#93c5fd}.ck1 i{color:#1d4ed8}
.ck2{border-color:#86efac}.ck2 i{color:#15803d}
.ck3{border-color:#f9a8d4}.ck3 i{color:#be185d}
.ck-sep{color:#d9c8a2;font-weight:800}
.gw{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #efe2c4}
.gw:last-child{border-bottom:none}
.gw b{font-family:Georgia,"Noto Serif",serif;min-width:84px}
.gw .gko{flex:1;color:#374151}
.pg-r .play{font-size:.95rem;padding:4px 8px;border-radius:8px;background:#f6eedc}
.wcard{background:#fff8e6;border:1.5px solid #fbbf24;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.wc-top{display:flex;align-items:center;gap:8px}
.wc-w{font-family:Georgia,"Noto Serif",serif;font-size:1.3rem}
.wc-p{color:#b45309;font-size:.85rem;font-weight:700}
.wc-top .play{margin-left:auto}
.wc-ko{font-size:1.05rem;font-weight:700;margin:4px 0 8px;color:#1f2937}
.rp-score{font-weight:900;font-size:1.05rem;margin-top:6px}
.rp-score.good{color:var(--green)}.rp-score.mid{color:var(--amber)}.rp-score.bad{color:var(--red)}
.rp-step{display:flex;gap:8px;margin-top:12px}
.rp-step .btn{flex:1}
.coco{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.coco .av{font-size:2.2rem;line-height:1}
.coco .bub{background:#fff;border:1.5px solid #f1d9a3;border-radius:16px;padding:10px 13px;font-size:.95rem;line-height:1.55}
.howto{list-style:none;display:grid;gap:7px;margin:4px 0 14px}
.howto li{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #efe2c4;border-radius:12px;padding:8px 11px;font-size:.88rem}
.howto li span{min-width:30px;text-align:center;font-size:1.05rem}
.howto .kwdemo{font-family:Georgia,serif;font-size:.95rem;border-bottom:2.5px dotted #f59e0b}
.kwchips{display:flex;flex-wrap:wrap;gap:6px}
.kwchip{background:#fff;border:1.5px solid #fcd34d;border-radius:999px;padding:5px 11px;font-size:.84rem;color:#374151}
.kwchip b{font-family:Georgia,serif;margin-right:5px;color:#2a1f14}
.kpara{line-height:1.85;margin-bottom:.7em;font-size:1rem;color:#1f2937}
.ks{cursor:pointer;border-radius:5px;padding:.06em 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ks.sel{background:#ffe49a}.ks.play{background:#d4f0de}
.bk-nav{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bk-nav .btn{min-width:130px}
.bk-dots{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:.8rem;font-weight:700}

// 마침표가 붙어도 문장이 끝나지 않는 약어 (Mr. Pebble, Dr. Finch ...)
const ABBR = new Set("mr mrs ms mx dr prof st jr sr mt ft vs etc no vol fig gen capt col lt sgt rev hon messrs mme mlle inc ltd co ave rd blvd dept approx".split(" "));
function splitSentences(text){
  const s = String(text).replace(/\s+/g," ").trim();
  if(!s) return [];
  const out = [];
  const re = /[.!?…]+["'”’)\]]*(?=\s|$)/g;
  let start = 0, m;
  while((m = re.exec(s))){
    const end = m.index + m[0].length;
    const rest = s.slice(end).replace(/^\s+/,"");
    if(!rest) break;
    // 다음 글자가 대문자·숫자·여는 따옴표일 때만 문장 끝 ("Hi!" she said. 는 한 문장)
    let stop = /^["“‘(\[]/.test(rest) || /^[A-Z0-9]/.test(rest);
    if(stop && m[0]==="."){
      const tok = (s.slice(start, m.index).match(/(\S+)$/)||["",""])[1].replace(/^["“‘(\[]+/,"");
      if(ABBR.has(tok.toLowerCase()) || /^[A-Za-z]$/.test(tok)) stop = false;   // 약어·이니셜
    }
    if(stop){ out.push(s.slice(start, end).trim()); start = end; }
  }
  const tail = s.slice(start).trim();
  if(tail) out.push(tail);
  return out.flatMap(capLong).slice(0, 20000);
}
function capLong(s){
  // 마침표 없이 너무 긴 문장(대본·목록)은 ; : , 근처에서 나눈다
  if(s.length <= 320) return [s];
  const cut = Math.max(s.lastIndexOf("; ", 260), s.lastIndexOf(": ", 260), s.lastIndexOf(", ", 260));
  if(cut < 80) return [s];
  return [s.slice(0, cut+1).trim()].concat(capLong(s.slice(cut+1).trim()));
}

const SMALL_W = new Set("a an the of in on at to and or but for with from by as".split(" "));
function isHeadingLine(s){
  return CHAP_HEAD.test(s) || OTHER_HEAD.test(s)
    || (s.length <= 60 && /[A-Z]{2}/.test(s) && !/[a-z]/.test(s) && !/[.!?]["”’]?$/.test(s));
}
function titleCase(s){
  return String(s).toLowerCase().split(" ").map((w,i)=> (i>0 && SMALL_W.has(w)) ? w
    : w.replace(/^([^a-z]*)([a-z])/, (m0,p,c)=>p+c.toUpperCase())).join(" ");
}
function fixSpacedCaps(t){
  // 자간 때문에 "C H A P T E R O N E"처럼 흩어진 대문자를 붙인다
  return t.replace(/\b(?:[A-Z] ){3,}[A-Z]\b/g, run=>{
    const w = run.replace(/ /g,"");
    const m = w.match(/^(CHAPTER|PROLOGUE|EPILOGUE)(.*)$/);
    return m? m[1] + (m[2]? " "+m[2] : "") : w;
  });
}
function fixCapsStart(p){
  // 챕터 첫 줄의 작은 대문자(MR. AND MRS. PEBBLE, of ...)를 보통 글씨로
  const toks = p.split(" ");
  let k = 0;
  while(k < toks.length && k < 8 && /[A-Z]/.test(toks[k]) && !/[a-z]/.test(toks[k])) k++;
  if(k < 2 || k >= toks.length || !/^[a-z]/.test(toks[k])) return p;
  const TITLES = new Set(["mr.","mrs.","ms.","dr.","prof."]);
  return toks.map((t,i)=>{
    if(i >= k) return t;
    const low = t.toLowerCase(), bare = low.replace(/[^a-z']/g,"");
    if(i>0 && !TITLES.has(low) && (SMALL_W.has(bare) || COMMON.has(bare))) return low;
    return low.replace(/^([^a-z]*)([a-z])/, (m0,q,c)=>q+c.toUpperCase());
  }).join(" ");
}
function joinLines(lines){
  let out = "";
  lines.forEach(l=>{
    l = l.trim(); if(!l) return;
    if(out && /[A-Za-z]-$/.test(out) && /^[a-z]/.test(l)) out = out.slice(0,-1) + l;   // 줄 끝 하이픈 잇기
    else out += (out? " ":"") + l;
  });
  return out;
}
function normLine(s){ return String(s).toLowerCase().replace(/\d+/g,"#").replace(/\s+/g," ").trim(); }
function pageNumLike(k){ return /^(?:page\s*)?(?:#|[ivxlc]{1,5})(?:\s*(?:\/|of)\s*#)?$/.test(k) || /^[-–—\s]*#[-–—\s]*$/.test(k); }
function dropRepeated(lines){
  // 쪽마다 반복되는 머리말·꼬리말·쪽번호 줄을 지운다
  const cnt = {};
  lines.forEach(l=>{ const k = normLine(l); if(k && k.length < 90) cnt[k] = (cnt[k]||0)+1; });
  return lines.filter(l=>{
    const k = normLine(l);
    if(!k) return true;
    if(pageNumLike(k)) return false;
    if(k.includes("#") && cnt[k] >= 3) return false;
    return !(cnt[k] >= 4 && k.length < 60 && !/[.!?]["”’]?$/.test(k));
  });
}
function textParas(text){
  const t = String(text).replace(/\r\n?/g,"\n").replace(/\u00ad/g,"").replace(/[ \t\u00a0]+/g," ");
  const lines = dropRepeated(t.split("\n").map(l=>l.trim()));
  // 빈 줄로 문단이 나뉜 글인지, 한 줄이 한 문단인 글인지
  const blankMode = lines.filter(l=>!l).length >= Math.max(2, lines.length*0.05);
  const paras = [];
  let cur = [], afterChap = false;
  const flush = ()=>{ if(cur.length){ paras.push(joinLines(cur)); cur = []; } };
  const alone = l=>{ flush(); cur.push(l); flush(); };
  lines.forEach(l=>{
    if(!l){ flush(); return; }
    // 제목 줄, 그리고 챕터 제목 바로 다음의 짧은 줄(부제)은 따로 한 문단
    if(isHeadingLine(l)){ alone(l); afterChap = CHAP_HEAD.test(l) || OTHER_HEAD.test(l); return; }
    if(afterChap && l.length <= 60 && !/[.!?]["”’]?$/.test(l)){ alone(l); afterChap = false; return; }
    afterChap = false;
    if(blankMode){ cur.push(l); return; }
    // 한 줄 = 한 문단. 단, 줄바꿈으로 잘린 문장은 이어 붙인다
    const prev = cur[cur.length-1];
    const cont = prev && !SPEAKER_RE.test(l) && (!/[.!?…:"”’)\]]$/.test(prev) || /^[a-z]/.test(l));
    if(!cont) flush();
    cur.push(l);
  });
  flush();
  const out = [];
  paras.forEach(p=>{
    p = fixSpacedCaps(p.replace(/\s+/g," ").trim());
    if(p) p.replace(INLINE_CHAP, "$1\n").split("\n").forEach(x=>{ x = x.trim(); if(x) out.push(x); });
  });
  return out;
}
function autoParas(ss){
  // 문단 정보가 없거나 너무 긴 문단은 대화·5문장 단위로 나눈다
  if(ss.length <= 6) return [ss];
  const groups = [];
  let g = [];
  ss.forEach(s=>{
    const dlg = /^["“‘]/.test(s) || SPEAKER_RE.test(s);
    const prevDlg = g.length && /["”’]$/.test(g[g.length-1]);
    if(g.length && (g.length >= 5 || dlg || (prevDlg && !/^[a-z]/.test(s)))){ groups.push(g); g = []; }
    g.push(s);
  });
  if(g.length) groups.push(g);
  return groups;
}
function paraStarts(groups){ const pb = []; let n = 0; groups.forEach(g=>{ pb.push(n); n += g.length; }); return pb; }
/* 책 전체 → 챕터 [{title, sub, sents, pb(문단이 시작하는 문장 번호)}] */
function parseBook(text){
  const paras = textParas(text);
  const chs = [];
  let cur = {title:"", sub:"", paras:[], pre:true};
  chs.push(cur);
  for(let i=0;i<paras.length;i++){
    const p = paras[i];
    const m = p.match(CHAP_HEAD) || p.match(OTHER_HEAD);
    if(!m){ cur.paras.push(cur.paras.length || cur.pre ? p : fixCapsStart(p)); continue; }
    let rest = p.slice(m[0].length).replace(/^[\s\-–—:.]+/,"").trim();
    let sub = "";
    if(rest && rest.length <= 60 && !/[.!?]["”’]?$/.test(rest)){ sub = rest; rest = ""; }
    else if(rest){
      // 바로 뒤 대문자 단어 묶음이 부제 (THE GIRL WHO HUMMED Mr. and ...)
      const toks = rest.split(" ");
      let k = 0;
      while(k < toks.length && k < 12 && /[A-Z]/.test(toks[k]) && !/[a-z.]/.test(toks[k])) k++;
      if(k>0 && k<toks.length && /^[AI]$/.test(toks[k-1])) k--;
      if(k>0 && k<toks.length){ sub = toks.slice(0,k).join(" "); rest = toks.slice(k).join(" "); }
    }
    if(!sub && !rest && i+1 < paras.length){
      const nx = paras[i+1];
      if(nx.length <= 60 && !/[.!?]["”’]?$/.test(nx) && !CHAP_HEAD.test(nx)){ sub = nx; i++; }
    }
    cur = {title: titleCase(m[0].replace(/[.:]$/,"")), sub: sub? titleCase(sub.replace(/[\s,:;\-–—]+$/,"")) : "", paras:[]};
    chs.push(cur);
    if(rest) cur.paras.push(fixCapsStart(rest));
  }
  const built = chs.map(c=>{
    const sents = [], pb = [];
    c.paras.forEach(p=>{
      autoParas(splitSentences(p)).forEach(g=>{ if(g.length){ pb.push(sents.length); sents.push(...g); } });
    });
    return {title:c.title, sub:c.sub, sents, pb, pre:!!c.pre};
  });
  const hasCh = built.some(c=>!c.pre && c.sents.length >= 3);
  let out;
  if(hasCh){
    // 목차처럼 본문이 거의 없는 '챕터'와 짧은 표지·저작권 글은 버린다
    out = built.filter(c=> c.pre ? c.sents.length >= 25 : c.sents.length >= 3);
    out.forEach(c=>{ if(c.pre) c.title = "Opening"; });
  } else {
    const all = {sents:[], pb:[]};
    built.forEach(c=>{ c.pb.forEach(b=>all.pb.push(all.sents.length + b)); all.sents.push(...c.sents); });
    if(!all.sents.length) return [];
    if(all.sents.length <= 60) out = [{title:"", sub:"", sents:all.sents, pb:all.pb}];
    else {
      // 챕터 표시가 없으면 문단 경계에서 약 50문장씩 파트로 나눈다
      out = [];
      let s0 = 0;
      while(s0 < all.sents.length){
        let e = Math.min(all.sents.length, s0 + 50);
        if(e < all.sents.length){
          const cand = all.pb.filter(b=>b > s0+35 && b <= s0+65);
          if(cand.length) e = cand.reduce((a,b)=>Math.abs(b-(s0+50)) < Math.abs(a-(s0+50)) ? b : a);
        }
        const pb = all.pb.filter(b=>b >= s0 && b < e).map(b=>b - s0);
        if(pb[0] !== 0) pb.unshift(0);
        out.push({title:"Part "+(out.length+1), sub:"", sents:all.sents.slice(s0, e), pb});
        s0 = e;
      }
    }
  }
  return out.map(c=>({title:c.title, sub:c.sub||"", sents:c.sents, pb:c.pb})).slice(0, 300);
}
function reparseOld(chs){
  // 예전 방식으로 저장된 책: 문장을 다시 이어 붙인 뒤 새 규칙으로 다시 나눈다
  const sents = [];
  (chs||[]).forEach(c=>(c.sents||[]).forEach(s=>sents.push(String(s))));
  const cnt = {};
  sents.forEach(s=>{ const k = normLine(s); if(k.length < 90) cnt[k] = (cnt[k]||0)+1; });
  const junk = Object.keys(cnt).filter(k=>k.includes("#") && cnt[k] >= 2 && /[a-z]{3}/.test(k));
  let text = sents.filter(s=>!junk.includes(normLine(s))).join(" ");
  junk.forEach(k=>{
    const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/#/g,"\\d+").replace(/ /g,"\\s+"), "gi");
    text = text.replace(re, " ");
  });
  return parseBook(text);
}
const _bookCache = {};
function getBook(id){
  if(_bookCache[id]) return _bookCache[id];
  const b = BOOKS_BUILTIN.find(x=>x.id===id);
  let book = null;
  if(b){
    const ss = splitSentences(b.text);
    book = { v:3, chapters:[{title:"", sub:"", sents:ss, pb:paraStarts(autoParas(ss))}] };
  } else {
    try{
      const raw = localStorage.getItem("english.book."+id);
      if(raw){
        const p = JSON.parse(raw);
        if(p.v===3 && p.chapters) book = p;
        else {
          // v1·v2 → v3: 새 규칙으로 다시 나누고, 문장 번호가 바뀌었으니 레슨 캐시는 비운다
          const old = p.chapters || (p.sentences? [{title:"", sents:p.sentences}] : []);
          book = { v:3, chapters: reparseOld(old) };
          try{ localStorage.setItem("english.book."+id, JSON.stringify(book)); }catch(e){}
          clearLessonCache(id);
          const meta = store.books.find(x=>x.id===id);
          if(meta){ meta.lpos = null; save(); }
        }
      }
    }catch(e){ console.warn(e); }
  }
  if(!book) book = { chapters: [] };
  _bookCache[id] = book;
  return book;
}
function bookTotal(book){ return book.chapters.reduce((a,c)=>a+c.sents.length,0); }
function posOf(meta){
  if(typeof meta.pos === "number") meta.pos = {c:0, s:meta.pos}; // v1 → v2 마이그레이션
  if(!meta.pos) meta.pos = {c:0, s:0};
  if(!meta.quiz) meta.quiz = {};
  return meta.pos;
}
function bookRead(book, meta){
  const pos = posOf(meta);
  let n = 0;
  book.chapters.forEach((c,i)=>{
    if(i < pos.c) n += c.sents.length;
    else if(i === pos.c) n += Math.min(pos.s, c.sents.length);
  });
  return n;
}
function ensureBookMeta(id, title, builtin){
  let m = store.books.find(b=>b.id===id);
  if(!m){ m = {id, title, builtin:!!builtin, pos:{c:0,s:0}, quiz:{}, addedAt:todayStr()}; store.books.push(m); save(); }
  posOf(m);
  return m;
}

/* 레슨(Day): 하루 30분 분량(약 15문장). 가능하면 문단 경계에서 자른다 */
const LESSON_SIZE = 15;
function lessonsOf(book){
  if(book._lessons) return book._lessons;
  const ls = [];
  book.chapters.forEach((ch,ci)=>{
    const n = ch.sents.length;
    if(!n) return;
    const pb = ch.pb && ch.pb.length? ch.pb : [0];
    const cuts = [0];
    let start = 0;
    while(n - start > LESSON_SIZE + 5){
      const target = start + LESSON_SIZE;
      let best = -1;
      pb.forEach(b=>{ if(b > start+9 && b <= start+21 && (best < 0 || Math.abs(b-target) < Math.abs(best-target))) best = b; });
      start = best > 0 ? best : target;
      cuts.push(start);
    }
    cuts.push(n);
    const parts = cuts.length-1;
    for(let p=0; p<parts; p++)
      ls.push({ci, start:cuts[p], end:cuts[p+1], chTitle:ch.title, chSub:ch.sub||"", part:p+1, parts});
  });
  book._lessons = ls;
  return ls;
}
function lessonSents(book, L){ return book.chapters[L.ci].sents.slice(L.start, L.end); }
function curLesson(){ const b = getBook(ui.bookId); return lessonsOf(b)[ui.li]; }
function curSents(){ const b = getBook(ui.bookId); const L = lessonsOf(b)[ui.li]; return L? lessonSents(b, L) : []; }
function curLD(){ return getLessonData(ui.bookId, ui.li, curSents()); }
/* 쪽: 한 Day를 책 한 쪽 분량(글자 수)으로 나눈다. 첫 쪽은 그림이 있어 조금 짧게 */
const PAGE_CHARS = 560, FIRST_PAGE_CHARS = 400;
function pagesOf(book, L){
  const key = L.ci+":"+L.start;
  book._pages = book._pages || {};
  if(book._pages[key]) return book._pages[key];
  const ch = book.chapters[L.ci];
  const pbs = new Set(ch.pb && ch.pb.length? ch.pb : [0]);
  const pages = [];
  let cur = [], len = 0;
  for(let k=L.start; k<L.end; k++){
    const s = ch.sents[k];
    const budget = pages.length? PAGE_CHARS : FIRST_PAGE_CHARS;
    const np = pbs.has(k);
    if(cur.length && (len + s.length > budget || (np && len > budget*0.8))){ pages.push(cur); cur = []; len = 0; }
    cur.push({i:k-L.start, s, np});
    len += s.length + 1 + (np? 45 : 0);   // 문단이 바뀌면 줄바꿈·여백만큼 더 차지한다
  }
  if(cur.length){
    // 마지막 쪽에 짧은 문장 하나만 남으면 앞 쪽에 붙인다
    const tail = cur.reduce((a,x)=>a+x.s.length, 0);
    const prev = pages[pages.length-1];
    if(prev && tail < PAGE_CHARS*0.25 && prev.reduce((a,x)=>a+x.s.length, 0) + tail <= PAGE_CHARS*1.3) prev.push(...cur);
    else pages.push(cur);
  }
  book._pages[key] = pages;
  return pages;
}
function pageOfSent(pages, i){ const p = pages.findIndex(pg=>pg.some(x=>x.i===i)); return p < 0 ? 0 : p; }
function ldoneOf(meta){
  if(!meta.ldone) meta.ldone = {};
  if(meta.cur == null) meta.cur = 0;
  return meta.ldone;
}
function lessonSig(sents){
  let h = 5381;
  const t = sents.join("\u0001");
  for(let i=0;i<t.length;i++) h = ((h<<5) + h + t.charCodeAt(i)) | 0;
  return sents.length + ":" + (h>>>0).toString(36);
}
function getLessonData(bookId, li, sents){
  try{
    const raw = localStorage.getItem("english.lesson."+bookId+"."+li);
    if(!raw) return null;
    const d = JSON.parse(raw);
    // 책을 다시 나눠서 문장이 달라진 레슨의 옛 데이터는 쓰지 않는다
    if(sents && d.sig && d.sig !== lessonSig(sents)) return null;
    if(sents && !d.sig && Array.isArray(d.trans) && d.trans.length !== sents.length) return null;
    return d;
  }catch(e){ return null; }
}
function setLessonData(bookId, li, data){
  const key = "english.lesson."+bookId+"."+li;
  const val = JSON.stringify(data);
  for(let n=0; n<8; n++){
    try{ localStorage.setItem(key, val); return true; }
    catch(e){ if(!evictOldLesson(key)) return false; }
  }
  return false;
}
function evictOldLesson(keep){
  // 저장 공간이 모자라면 가장 오래전에 만든 레슨 데이터부터 지운다
  const ks = Object.keys(localStorage).filter(k=>k.indexOf("english.lesson.")===0 && k!==keep);
  if(!ks.length) return false;
  let oldest = ks[0], ot = Infinity;
  ks.forEach(k=>{ let t = 0; try{ t = (JSON.parse(localStorage.getItem(k))||{}).at || 0; }catch(e){} if(t < ot){ ot = t; oldest = k; } });
  localStorage.removeItem(oldest);
  return true;
}
function clearLessonCache(bookId){
  try{ Object.keys(localStorage).filter(k=>k.indexOf("english.lesson."+bookId+".")===0).forEach(k=>localStorage.removeItem(k)); }catch(e){}
}
function ldSent(ld, i){
  if(!ld || i==null) return null;
  if(Array.isArray(ld.s)) return ld.s[i] || null;
  if(Array.isArray(ld.trans) && ld.trans[i]) return {ko:ld.trans[i], c:[], g:[]};
  return null;
}
/* 레슨 자동 생성 프롬프트 — 사용자가 불러온 글에서 그때그때 만든다 */
const LESSON_PROMPT = `You are making today's English reading lesson for a Korean 4th-grade student (10 years old, beginner) who is reading a real English book. You get numbered sentences from today's pages. Reply with ONLY one JSON object, no markdown, no code fence:
{"s":[{"ko":"...","c":[["English chunk","한국어 뜻"]],"g":[{"w":"word","ko":"짧은 뜻"}]}],
 "words":[{"w":"word","p":"한글 발음","ko":"쉬운 뜻"}],
 "grammar":[{"t":"문형","ko":"쉬운 설명","ex":"example from the text"}],
 "expr":[{"en":"expression","ko":"뜻과 느낌"}],
 "quiz":[{"q":"문제","opts":["...","...","...","..."],"a":0}]}
Rules:

- "ko": a natural, warm Korean translation that a 10-year-old understands (해요체). Write names in Korean letters. No notes, no markdown symbols.
- "c": cut the sentence into 2-6 meaning chunks in English word order (끊어 읽기). Copy each chunk exactly from the sentence; together the chunks make the whole sentence. Give each chunk a short Korean meaning that follows the English order. A very short sentence is one chunk.
- "g": 0-4 words in this sentence that a beginner may not know (skip easy words and names). "w" exactly as written in the sentence, lowercase. "ko" is 1-4 Korean words.
- "words": the 10-15 most useful words of today's text, hardest first. "w" in dictionary form, "p" is Korean-letter pronunciation like 미스테리어스, "ko" an easy meaning.
- "grammar": 1-2 simple sentence patterns from the text. "expr": 1-2 useful expressions from the text.
- "quiz": 4 multiple-choice questions in simple Korean — 2 about word meanings, 2 about what happened. "a" is the index (0-3) of the correct option.`;
const WORD_PROMPT = `You help a Korean 10-year-old who is reading an English book. Explain the given word as it is used in the sentence. Reply with ONLY JSON: {"p":"Korean-letter pronunciation like 미스테리어스","ko":"very short, easy Korean meaning (1-5 words)"}`;
function cleanTxt(v){ return String(v==null? "" : v).replace(/[*_`#]+/g,"").replace(/\s+/g," ").trim(); }
function parseLessonJSON(rep, n){
  let t = String(rep||"").replace(/```(?:json)?/gi,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a < 0 || b <= a) throw new Error("AI 답을 읽지 못했어요. 한 번 더 눌러 주세요");
  t = t.slice(a, b+1);
  let d;
  try{ d = JSON.parse(t); }
  catch(e){
    try{ d = JSON.parse(t.replace(/,\s*([}\]])/g,"$1")); }
    catch(e2){ throw new Error("AI 답이 중간에 끊겼어요. 한 번 더 눌러 주세요"); }
  }
  const arr = x=>Array.isArray(x)? x : [];
  let s = arr(d.s);
  if(!s.length && arr(d.trans).length) s = d.trans.map(ko=>({ko}));
  if(!s.length) throw new Error("AI 답을 읽지 못했어요. 한 번 더 눌러 주세요");
  s = s.slice(0, n).map(x=>{
    x = (x && typeof x==="object")? x : {ko:x};
    return {
      ko: cleanTxt(x.ko),
      c: arr(x.c).filter(p=>Array.isArray(p) && p[0]).map(p=>[cleanTxt(p[0]), cleanTxt(p[1])]).slice(0,8),
      g: arr(x.g).filter(g=>g && g.w).map(g=>({w:cleanTxt(g.w).toLowerCase(), ko:cleanTxt(g.ko)})).slice(0,6)
    };
  });
  while(s.length < n) s.push({ko:"", c:[], g:[]});
  return {
    s,
    words: arr(d.words).filter(w=>w && w.w).map(w=>({w:cleanTxt(w.w), p:cleanTxt(w.p).replace(/^\[|\]$/g,""), ko:cleanTxt(w.ko)})).slice(0,20),

function chapterWords(sents){
  const text = sents.join(" ");
  // 항상 대문자로만 나오는 단어(고유명사)는 제외한다
  const lowerSet = new Set((text.match(/\b[a-z][a-z']{3,}\b/g)||[]));
  const freq = {};
  (text.match(/\b[A-Za-z][A-Za-z']{3,}\b/g)||[]).forEach(w0=>{
    const w = w0.toLowerCase();
    if(COMMON.has(w) || !lowerSet.has(w)) return;
    freq[w] = (freq[w]||0)+1;
  });
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,12).map(e=>e[0]);
}

/* 레슨 퀴즈 보조 문제 생성 (로컬) */
function buildQuizSents(sents, maxN){
  const cands = sents.filter(s=>{ const n = normWords(s).length; return n>=4 && n<=18 && s.length<=140; });
  const words = chapterWords(sents);
  const pool = words.length>=4? words
    : Array.from(new Set(cands.flatMap(s=>normWords(s)).filter(w=>w.length>=4 && !COMMON.has(w)))).slice(0,12);
  const qs = [];
  // 🔤 빈칸 채우기
  shuffle(cands.filter(s=>normWords(s).some(w=>pool.includes(w)))).slice(0,3).forEach(s=>{
    const target = normWords(s).find(w=>pool.includes(w));
    const others = shuffle(pool.filter(w=>w!==target)).slice(0,3);
    if(others.length < 2) return;
    const opts = shuffle([target, ...others]);
    qs.push({ type:"cloze", text:s, opts, ans:opts.indexOf(target),
              blank: s.replace(new RegExp("\\b"+target+"\\b","i"), "_____") });
  });
  // 👂 듣고 고르기
  shuffle(cands).slice(0,2).forEach(s=>{
    const others = shuffle(cands.filter(x=>x!==s)).slice(0,2);
    if(others.length < 2) return;
    const opts = shuffle([s, ...others]);
    qs.push({ type:"listen", target:s, opts, ans:opts.indexOf(s) });
  });
  // 🧩 문장 조립
  shuffle(cands.filter(s=>{ const n = s.replace(/[.,!?"“”]/g,"").split(/\s+/).filter(Boolean).length; return n>=4 && n<=8; }))
    .slice(0,2).forEach(s=>qs.push({ type:"order", target:s }));
  return shuffle(qs).slice(0, maxN||8);
}

/* PDF 텍스트 추출 (필요할 때만 pdf.js 로드 — 처음 한 번 인터넷 필요) */
function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = res;
    s.onerror = ()=>rej(new Error("인터넷 연결을 확인해 주세요 (PDF 변환 도구를 내려받지 못했어요)"));
    document.head.appendChild(s);
  });
}
async function extractPdfText(file){
  if(!window.pdfjsLib){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  const pages = [];
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push(pdfLines(tc.items));
  }
  return pdfToText(pages);
}
/* 글자 조각 → 줄 (같은 높이(y)의 조각을 왼쪽부터 잇는다) */
function pdfLines(items){
  const lines = [];
  let cur = null;
  items.forEach(it=>{
    if(typeof it.str !== "string") return;
    const tr = it.transform || [1,0,0,1,0,0];
    const x = tr[4], y = tr[5], h = Math.abs(tr[3]) || it.height || 10;
    if(it.str.trim()){
      if(cur && Math.abs(y - cur.y) <= Math.max(2, h*0.45)){
        const gap = x - cur.x2;
        if(gap > h*0.15 && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += " ";
        cur.text += it.str;
        cur.x2 = Math.max(cur.x2, x + (it.width||0));
        cur.h = Math.max(cur.h, h);
      } else {
        cur = {x, y, x2: x + (it.width||0), h, text: it.str};
        lines.push(cur);
      }
    }
    if(it.hasEOL) cur = null;
  });
  lines.forEach(l=>{ l.text = l.text.replace(/\s+/g," ").trim(); });
  return lines.filter(l=>l.text).sort((a,b)=>(b.y - a.y) || (a.x - b.x));
}
/* 줄 → 문단 (줄 간격·들여쓰기·짧게 끝난 줄로 문단을 되살린다) */
function pdfToText(pages){
  const edgeCnt = {};
  const edges = ls=>[ls[0], ls[1], ls[ls.length-2], ls[ls.length-1]].filter(Boolean);
  pages.forEach(ls=>new Set(edges(ls)).forEach(l=>{ const k = normLine(l.text); edgeCnt[k] = (edgeCnt[k]||0)+1; }));
  const minRep = Math.max(2, Math.ceil(pages.length*0.25));
  const all = pages.map(ls=>{
    const ed = new Set(edges(ls));
    // 쪽번호·쪽마다 반복되는 머리말/꼬리말 제거
    const keep = ls.filter(l=>{ const k = normLine(l.text); return !pageNumLike(k) && !(ed.has(l) && edgeCnt[k] >= minRep && k.length < 100); });
    return fixDropCaps(keep);
  });
  const gaps = [], hs = [];
  all.forEach(ls=>{
    ls.forEach((l,i)=>{ hs.push(l.h); if(i){ const g = ls[i-1].y - l.y; if(g > 0 && g < l.h*4) gaps.push(g); } });
  });
  const med = a=>{ if(!a.length) return 0; const b = a.slice().sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; };
  const gapM = med(gaps) || 14, hM = med(hs) || 12;
  const paras = [];
  let cur = [];
  const flush = ()=>{ if(cur.length){ paras.push(joinLines(cur)); cur = []; } };
  all.forEach(ls=>{
    if(!ls.length) return;
    const xs = ls.map(l=>l.x).sort((a,b)=>a-b);
    const left = xs[Math.floor(xs.length*0.2)];
    const rs = ls.map(l=>l.x2).sort((a,b)=>a-b);
    const right = rs[Math.floor(rs.length*0.9)];
    const width = Math.max(1, right - left);
    const ragged = ls.filter(l=>l.x2 < right - width*0.15).length / ls.length > 0.45;
    ls.forEach((l,i)=>{
      const prev = i? ls[i-1] : null;
      const indent = l.x > left + hM*0.8;
      let brk;
      if(!prev){
        // 쪽의 첫 줄: 들여쓰기나 제목이면 새 문단, 아니면 앞 쪽에서 이어진다
        const last = cur.length? cur[cur.length-1] : "";
        brk = !last || indent || isHeadingLine(l.text) || isHeadingLine(last) || SPEAKER_RE.test(l.text);
      } else {
        brk = (prev.y - l.y) > gapM*1.3
          || indent || /^[(\[]/.test(l.text)
          || (!ragged && prev.x2 < right - width*0.12 && /[.!?…:"”’)\]]$/.test(prev.text))
          || isHeadingLine(l.text) || isHeadingLine(prev.text) || SPEAKER_RE.test(l.text);
      }
      if(brk) flush();
      cur.push(l.text);
    });
  });
  flush();
  return paras.join("\n\n");
}
function fixDropCaps(ls){
  // 크게 쓴 첫 글자(드롭캡)를 그 옆 줄 맨 앞에 붙인다
  const hs = ls.map(l=>l.h).sort((a,b)=>a-b);
  const hM = hs[Math.floor(hs.length/2)] || 12;
  const drops = ls.filter(l=>/^[A-Z]$/.test(l.text) && l.h > hM*1.8);
  if(!drops.length) return ls;
  const out = ls.filter(l=>!drops.includes(l));
  drops.forEach(d=>{
    const near = out.filter(l=>l.y <= d.y + d.h && l.y >= d.y - hM*0.5);
    const target = near.sort((a,b)=>b.y - a.y)[0];
    if(target){ target.text = d.text + target.text; target.x = Math.min(target.x, d.x); }
  });
  return out;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function markPracticed(profile){
  const p = store.profiles[profile];
  const t = todayStr();
  if(!p.days.includes(t)){ p.days.push(t); if(p.days.length>400) p.days = p.days.slice(-400); }
  save();
}
function streakOf(profile){
  const days = new Set(store.profiles[profile].days);
  let streak = 0;
  const d = new Date();
  // 오늘 안 했으면 어제부터 센다
  if(!days.has(todayStr())) d.setDate(d.getDate()-1);
  for(;;){
    const s = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(days.has(s)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

/* ---------- 음성 (TTS / STT) ---------- */
const synth = window.speechSynthesis;
let enVoices = [];
function loadVoices(){
  if(!synth) return;
  enVoices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function pickVoice(accent){
  if(!enVoices.length) return null;
  if(accent){
    // 🇺🇸/🇬🇧 억양 선택 (기기에 해당 음성이 있을 때)
    const want = accent==="gb" ? "en-gb" : "en-us";
    const v = enVoices.find(x=>x.lang.toLowerCase().replace("_","-")===want);
    if(v) return v;
  }
  if(store.settings.voiceURI){
    const v = enVoices.find(v=>v.voiceURI===store.settings.voiceURI);
    if(v) return v;
  }
  return enVoices.find(v=>v.lang==="en-US") || enVoices[0];
}
let speakingToken = 0;
function speak(text, opts){
  opts = opts || {};
  if(!synth){ if(opts.onend) opts.onend(); return; }
  synth.cancel();
  const token = ++speakingToken;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = opts.accent==="gb" ? "en-GB" : "en-US";
  u.rate = opts.rate != null ? opts.rate : store.settings.rate;
  const v = pickVoice(opts.accent); if(v) u.voice = v;
  if(opts.onword) u.onboundary = (e)=>{ if(token===speakingToken && (!e.name || e.name==="word")) opts.onword(e.charIndex); };
  u.onend = ()=>{ if(token===speakingToken && opts.onend) opts.onend(); };
  u.onerror = ()=>{ if(token===speakingToken && opts.onend) opts.onend(); };
  synth.speak(u);
}
function stopSpeak(){ speakingToken++; if(synth) synth.cancel(); }

const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, recActive = false;
function sttStart(handlers){
  if(!SRClass){ if(handlers.onError) handlers.onError("unsupported"); return false; }
  stopSpeak();
  try{
    rec = new SRClass();
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    let finalText = "";
    rec.onresult = (ev)=>{
      let interim = "";
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r = ev.results[i];
        if(r.isFinal) finalText += r[0].transcript + " ";
        else interim += r[0].transcript;
      }
      if(handlers.onInterim) handlers.onInterim((finalText+interim).trim());
    };
    rec.onerror = (ev)=>{ recActive=false; if(handlers.onError) handlers.onError(ev.error||"error"); };
    rec.onend = ()=>{ recActive=false; if(handlers.onEnd) handlers.onEnd(finalText.trim()); };
    rec.start();
    recActive = true;
    return true;
  }catch(e){ recActive=false; if(handlers.onError) handlers.onError("start-failed"); return false; }
}
function sttStop(){ if(rec && recActive){ try{ rec.stop(); }catch(e){} } }

/* ---------- 채점 ---------- */
function normWords(s){
  return s.toLowerCase()
    .replace(/[’]/g,"'")
    .replace(/[^a-z0-9' ]+/g," ")
    .split(/\s+/).filter(Boolean);
}
function scoreSpeech(target, spoken){
  const t = normWords(target), s = normWords(spoken);
  const marks = t.map(()=>false);
  let j = 0, hits = 0;
  for(let i=0;i<t.length;i++){
    const k = s.indexOf(t[i], j);
    if(k >= 0){ marks[i]=true; hits++; j = k+1; }
  }
  return { pct: t.length ? Math.round(hits/t.length*100) : 0, marks };
}
function markedTarget(target, marks){
  // 원문 표기 단어 위에 채점 색을 입힌다 (하이픈 단어는 채점 토큰 여러 개를 소비)
  const words = target.split(/\s+/);
  let mi = 0;
  return words.map(w=>{
    const toks = normWords(w);
    if(!toks.length) return esc(w);
    let ok = true;
    toks.forEach(()=>{ if(!marks[mi]) ok = false; mi++; });
    return '<span class="'+(ok?"word-ok":"word-miss")+'">'+esc(w)+"</span>";
  }).join(" ");
}
function scoreClass(pct){ return pct>=80 ? "good" : pct>=50 ? "mid" : "bad"; }
function scoreMsg(pct){
  if(pct>=90) return "완벽해요! 👏";
  if(pct>=80) return "아주 좋아요! 🎉";
  if(pct>=60) return "좋아요! 조금만 더!";
  if(pct>=30) return "다시 한번 해볼까요?";
  return "괜찮아요, 천천히 다시!";
}

/* ---------- 유틸 ---------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function $(id){ return document.getElementById(id); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function getScenario(profile, id){
  return CONTENT[profile].scenarios.find(s=>s.id===id);
}
function scenProg(profile, id){
  const p = store.profiles[profile].scen[id];
  return p || { listen:0, repeat:0, role:0 };
}
function setScenProg(profile, id, field, val){
  const p = store.profiles[profile];
  if(!p.scen[id]) p.scen[id] = { listen:0, repeat:0, role:0 };
  p.scen[id][field] = Math.max(p.scen[id][field]||0, val);
  save();
}

/* ----- 책 리더: 왼쪽 원서 · 오른쪽 풀이 (좁은 화면에서는 아래에서 올라오는 풀이 창) ----- */
function wkey(w){ return String(w||"").toLowerCase().replace(/’/g,"'").replace(/^'+|'+$/g,""); }
function stemForms(w){
  // 간단한 어형 변화: involved → involve, polishing → polish, neighbours → neighbour ...
  const out = [w];
  const add = x=>{ if(x.length >= 2 && !out.includes(x)) out.push(x); };
  if(w.endsWith("'s")) add(w.slice(0,-2));
  if(w.endsWith("ies")) add(w.slice(0,-3)+"y");
  if(w.endsWith("es")) add(w.slice(0,-2));
  if(w.endsWith("s")) add(w.slice(0,-1));
  if(w.endsWith("ied")) add(w.slice(0,-3)+"y");
  if(w.endsWith("ed")){ add(w.slice(0,-2)); add(w.slice(0,-1)); if(/([^aeiou])\1ed$/.test(w)) add(w.slice(0,-3)); }
  if(w.endsWith("ing")){ add(w.slice(0,-3)); add(w.slice(0,-3)+"e"); if(/([^aeiou])\1ing$/.test(w)) add(w.slice(0,-4)); }
  if(w.endsWith("ly")) add(w.slice(0,-2));
  if(w.endsWith("est")) add(w.slice(0,-3));
  if(w.endsWith("er")) add(w.slice(0,-2));
  return out;
}
function dayDict(ld){
  const kw = new Map(), gl = new Map();
  if(ld){
    (ld.words||[]).forEach(w=>{ const k = wkey(w.w); if(k && !kw.has(k)) kw.set(k, w); });
    (ld.s||[]).forEach(x=>((x && x.g) || []).forEach(g=>{ const k = wkey(g.w); if(k && !gl.has(k)) gl.set(k, g); }));
  }
  return {kw, gl};
}
function lookupWord(w, i, ld, dd){
  const key = wkey(w);
  if(!key) return null;
  const forms = stemForms(key);
  const ss = ldSent(ld, i);
  const g = ss && (ss.g||[]).find(x=>wkey(x.w)===key);
  const k = forms.map(f=>dd.kw.get(f)).find(Boolean);
  if(g || k) return {w:key, p:(k && k.p) || "", ko:(g && g.ko) || (k && k.ko) || ""};
  const g2 = forms.map(f=>dd.gl.get(f)).find(Boolean);
  if(g2) return {w:key, p:"", ko:g2.ko};
  const wd = store.wdict || {};
  const f = forms.find(x=>wd[x]);
  if(f) return {w:key, p:wd[f].p||"", ko:wd[f].ko||""};
  const v = store.vocab.find(x=>x.ko && forms.includes(wkey(x.w)));
  return v? {w:key, p:"", ko:v.ko} : null;
}
function shortKo(ko){ const s = String(ko||"").split(/[,/;(]/)[0].trim(); return s.length > 9 ? s.slice(0,8)+"…" : s; }
function sentTokens(s, off){
  const out = [], re = /[A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z]/g;
  let last = 0, m;
  while((m = re.exec(s))){
    if(m.index > last) out.push({t:s.slice(last, m.index)});
    out.push({t:m[0], w:wkey(m[0]), o:m.index + (off||0)});
    last = m.index + m[0].length;
  }
  if(last < s.length) out.push({t:s.slice(last)});
  return out;
}
function sentHTML(it, sess, ld, dd, hints){
  const sm = it.s.match(SPEAKER_RE);
  const off = sm? sm[0].length : 0;
  const inner = sentTokens(it.s.slice(off), off).map(t=>{
    if(!t.w) return esc(t.t);
    const kw = stemForms(t.w).some(f=>dd.kw.has(f));
    const cls = "w" + (kw? " kw":"") + (sess.sel===it.i && sess.selW===t.w? " wsel":"");
    const span = `<span class="${cls}" data-w="${esc(t.w)}" data-o="${t.o}">${esc(t.t)}</span>`;
    if(hints && !COMMON.has(t.w)){
      const info = lookupWord(t.w, it.i, ld, dd);
      if(info && info.ko) return `<ruby>${span}<rt>${esc(shortKo(info.ko))}</rt></ruby>`;
    }
    return span;
  }).join("");
  const spk = sm? `<b class="spk">${esc(sm[0].replace(/\s*:\s*$/,""))}</b> ` : "";
  return `<span class="s${sess.sel===it.i?" sel":""}${sess.playIdx===it.i?" play":""}" data-i="${it.i}">${spk}${inner}</span>`;
}
function paraGroups(page){
  const gs = [];
  page.forEach((it,j)=>{ if(j===0 || it.np) gs.push([]); gs[gs.length-1].push(it); });
  return gs;
}

const CLIP_HEADER = "[영어 회화 연습 롤플레잉입니다. 이 대화가 끝날 때까지 아래 역할과 규칙을 유지해 주세요.]\n\n";
const CLIP_EXTRA = `\n\nExtra commands (follow these throughout the conversation):
- If I say "hint", pause and suggest 3 replies I could say next (easy, medium, challenging), then continue the roleplay.
- If I say "report", write a short feedback report in KOREAN with three sections — 📌 문법 교정 / ✨ 더 자연스러운 표현 / 👍 잘한 점 — then continue.`;
function claudePrompt(kind, id, gender){
  if(kind==="coco")
    return CLIP_HEADER + AI_PROMPTS.gio + CLIP_EXTRA + `\n\nStart now by greeting me: "Woof woof! Hi! I'm Coco! 🐶 What's your name?"`;
  if(kind==="coach")
    return CLIP_HEADER + AI_PROMPTS.dad + CLIP_EXTRA + `\n\nStart now by greeting me in English and asking about my day.`;
  if(kind==="buddy"){

    return CLIP_HEADER + buddySystem(p, gender) + CLIP_EXTRA + `\n\nStart now with: "${p.opener}"`;

function fallbackCopy(t){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(()=>true).catch(()=>fallbackCopy(t));
  }
  return Promise.resolve(fallbackCopy(t));
}

async function callAPI(system, messages, maxTokens, opts){
  if(apiProvider()==="gemini") return callGemini(system, messages, maxTokens, opts);
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": store.settings.apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({
      model: activeModel(),
      max_tokens: maxTokens || 1024,
      system: system,
      messages: messages
    })
  });
  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j.error && j.error.message) || ""; }catch(e){}
    if(res.status===401) throw new Error("API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.");
    if(res.status===429) throw new Error("요청이 너무 많아요. 잠시 후 다시 시도해 주세요.");
    throw new Error("API 오류 ("+res.status+") "+detail);
  }
  const data = await res.json();
  if(data.stop_reason==="refusal") return "Sorry, I can't talk about that. Let's talk about something else! 😊";
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}
async function callGemini(system, messages, maxTokens, opts){
  // 503(혼잡)·429(한도)는 2초 쉬고 재시도, 그래도 안 되면 경량 모델로 우회
  const main = activeModel();
  const plan = main==="gemini-3.5-flash-lite" ? [main, main] : [main, main, "gemini-3.5-flash-lite"];
  let lastErr = null;
  for(let i=0;i<plan.length;i++){
    if(i>0) await new Promise(r=>setTimeout(r,2000));
    try{ return await geminiOnce(plan[i], system, messages, maxTokens, opts); }
    catch(e){ if(!e.retryable) throw e; lastErr = e; }
  }
  throw lastErr;
}
async function geminiOnce(model, system, messages, maxTokens, opts){
  const body = {
    system_instruction:{ parts:[{ text: system }] },
    contents: messages.map(m=>({ role: m.role==="assistant"?"model":"user", parts:[{ text: m.content }] })),
    // '생각' 토큰이 출력 한도를 같이 먹으므로 여유분을 더해 빈 답을 방지
    generationConfig:{ maxOutputTokens: (maxTokens || 1024) + 4096 }
  };
  // 3.8 Flash는 thinkingLevel 지원 — low로 낮춰 답을 빠르게 (타 모델은 기본값 유지)
  if(model==="gemini-3.8-flash") body.generationConfig.thinkingConfig = { thinkingLevel: "low" };
  if(opts && opts.json) body.generationConfig.responseMimeType = "application/json";
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-goog-api-key": store.settings.apiKey },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j.error && j.error.message) || ""; }catch(e){}
    let msg;
    if(res.status===400 && /API key/i.test(detail)) msg = "API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.";
    else if(res.status===429) msg = "무료 사용량 한도에 걸렸어요. 1분쯤 쉬었다가 다시 해보세요.";
    else if(res.status===503) msg = "구글 AI 서버가 지금 붐벼요. 잠깐 뒤 다시 눌러보세요.";
    else msg = "API 오류 ("+res.status+") "+detail;
    const err = new Error(msg);
    err.retryable = (res.status===429 || res.status>=500);
    throw err;
  }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  if(!cand || !cand.content || !cand.content.parts)
    return "Sorry, I can't talk about that. Let's talk about something else! 😊";
  return cand.content.parts.filter(p=>p.text).map(p=>p.text).join("\n").trim();
}
async function chatReply(pid){
  // 리포트 등 sys 메시지는 문맥에서 제외하고, 연속 같은 역할 메시지는 합친다
  const recent = store.profiles[pid].chat.filter(m=>!m.sys).slice(-20);
  const msgs = [];
  recent.forEach(m=>{
    const last = msgs[msgs.length-1];
    if(last && last.role===m.role) last.content += "\n" + m.content;
    else msgs.push({role:m.role, content:m.content});
  });
  // 페르소나/롤플레잉 오프닝(assistant)으로 시작하는 경우 API 규칙에 맞게 user 턴을 앞에 채운다
  if(msgs.length && msgs[0].role==="assistant") msgs.unshift({role:"user", content:"(Let's start the conversation.)"});
  return callAPI(buildSystem(pid), msgs);
}
